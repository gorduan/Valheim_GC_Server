# GC_Vorratsleiste - Deutsch. Schlüssel mit eigenem Präfix (gcvl_).
gck_mod_vorratsleiste: "Vorratsleiste"
gcvl_title: "Vorräte"
gcvl_help: "Nur Essen, Tränke und Mets, Pfeile, Bolzen und Köder. Rechtsklick benutzt, Bogen und Armbrust nehmen Munition auch von hier."
gcvl_only: "In die Vorratsleiste kommen nur Essen, Tränke und Munition."
gcvl_off: "Die Vorratsleiste ist auf diesem Server aus, du kannst sie nur leeren."
gcvl_no_room: "Kein Platz frei."
gcvl_locked: "Dieser Vorratsplatz ist auf diesem Server gesperrt, du kannst ihn nur leeren."
gcvl_t_slots_name: "Vorratsplätze"
gcvl_t_slots_desc: "So viele Vorratsplätze hat jeder Spieler, im Rucksack und in den Sätzen am Kleiderschrank gleichermaßen (1–64, Standard 8; je acht eine Reihe). Weniger: was in den übrigen Plätzen liegt, lässt sich nur noch herausnehmen."
gcvl_t_enabled_name: "Vorratsleiste"
gcvl_t_enabled_desc: "Plätze unter dem Inventar nur für Essen, Tränke, Mets und Munition; zählt zum Gewicht, kommt beim Tod mit ins Grab, Bogen und Armbrust nehmen Munition auch von dort. Aus: nimmt nichts mehr an, Vorhandenes lässt sich herausnehmen."
gcvl_fill: "Auffüllen"
gcvl_store: "Einlagern"
gcvl_filled: "$1 Vorräte aus $2 Kiste(n) in die Leiste gelegt."
gcvl_stored: "$1 Vorräte in $2 Kiste(n) eingelagert."
gcvl_nothing: "Nichts zu verschieben."
gcvl_fill_topic: "Vorräte auffüllen"
gcvl_store_topic: "Vorräte einlagern"
gcvl_fill_help: "Füllt die Stapel der Leiste auf: aus der offenen Kiste, dann $1. Leere Plätze füllt nur die offene Kiste. Fixierte Items bleiben, wo sie sind."
gcvl_store_help: "Legt die Vorräte auf gleiche Stapel der offenen Kiste, dann $1, den Rest in freie Plätze der offenen Kiste. Fixierte Items bleiben in der Leiste."
gcvl_reach_fill: "aus Kisten bis $1 m ringsum, die nächste zuerst (ValheimPlus, Craft from Chest)"
gcvl_reach_store: "in Kisten bis $1 m ringsum, die das Stück schon haben (ValheimPlus, Auto Stack)"
gcvl_reach_fill_off: "aus keiner weiteren (Kisten ringsum nur mit ValheimPlus und eingeschaltetem Craft from Chest)"
gcvl_reach_store_off: "in keine weitere (Kisten ringsum nur mit ValheimPlus und eingeschaltetem Auto Stack)"
gcvl_refused: "$1 Kiste(n) belegt oder ohne Antwort."
gcvl_t_keepone_name: "Auffüllen lässt eins in der Kiste"
gcvl_t_keepone_desc: "Auffüllen nimmt von jeder Sorte höchstens alles bis auf ein Stück aus jeder Kiste, auch aus der offenen, damit die Kiste weiter weiß, was in sie gehört."
