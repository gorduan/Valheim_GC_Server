# GC_Vorratsleiste - English. Keys with their own prefix (gcvl_).
gck_mod_vorratsleiste: "Supply bar"
gcvl_title: "Supplies"
gcvl_help: "Food, potions and meads, arrows, bolts and bait only. Right click uses, bows and crossbows take ammo from here too."
gcvl_only: "Only food, potions and ammo go into the supply bar."
gcvl_off: "The supply bar is off on this server, you can only empty it."
gcvl_no_room: "No free slot."
gcvl_locked: "This supply slot is locked on this server, you can only empty it."
gcvl_t_slots_name: "Supply slots"
gcvl_t_slots_desc: "This many supply slots every player has, in the backpack and in the sets at the wardrobe alike (1–64, default 8; eight per row). Fewer: whatever lies in the other slots can only be taken out."
gcvl_t_enabled_name: "Supply bar"
gcvl_t_enabled_desc: "Slots below the inventory for food, potions, meads and ammo only; counts towards weight, goes into the grave on death, bows and crossbows take ammo from it too. Off: takes nothing more, whatever is in it can be taken out."
gcvl_fill: "Fill"
gcvl_store: "Store"
gcvl_filled: "$1 supplies taken from $2 chest(s) into the bar."
gcvl_stored: "$1 supplies stored in $2 chest(s)."
gcvl_nothing: "Nothing to move."
gcvl_fill_topic: "Fill supplies"
gcvl_store_topic: "Store supplies"
gcvl_fill_help: "Tops up the stacks of the bar: from the open chest, then $1. Empty slots are filled from the open chest only. Locked items stay where they are."
gcvl_store_help: "Puts the supplies onto matching stacks of the open chest, then $1, the rest into free slots of the open chest. Locked items stay in the bar."
gcvl_reach_fill: "from chests within $1 m, nearest first (ValheimPlus, Craft from Chest)"
gcvl_reach_store: "into chests within $1 m that already hold the item (ValheimPlus, Auto Stack)"
gcvl_reach_fill_off: "from no other (chests around only with ValheimPlus and Craft from Chest on)"
gcvl_reach_store_off: "into no other (chests around only with ValheimPlus and Auto Stack on)"
gcvl_refused: "$1 chest(s) in use or not answering."
gcvl_t_keepone_name: "Fill leaves one in the chest"
gcvl_t_keepone_desc: "Fill takes at most all but one of each kind from every chest, the open one too, so the chest still knows what belongs in it."
