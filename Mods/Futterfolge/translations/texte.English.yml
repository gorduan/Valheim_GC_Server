# GC_Futterfolge - English. Keys with their own prefix (gcff_).
gck_mod_futterfolge: "Feeding order"
gcff_t_enabled_name: "Feeding order"
gcff_t_enabled_desc: "Tamed animals spot food further away if a path leads there. The highest-level animal of a kind eats first, then the next."
gcff_t_range_name: "Range"
gcff_t_range_desc: "Factor on Valheim's food search radius (2 = twice as far)."
gcff_t_wait_name: "Wait at most"
gcff_t_wait_desc: "How long an animal lets higher-ranked ones eat first before it eats anyway. 0 = never wait."
gcff_t_pregnant_name: "Pregnant ones last"
gcff_t_pregnant_desc: "Pregnant animals queue at the back. They need no food for breeding, so the animals that can mate get fed first."
gcff_t_partner_name: "Best mate"
gcff_t_partner_desc: "The offspring's level uses the best fed mate at conception instead of the nearest animal (with GC_Tiere)."
gcff_t_wild_name: "Wild animals too"
gcff_t_wild_desc: "Wild animals being tamed spot food just as far, without an order."
gcff_t_rank_name: "Show rank"
gcff_t_rank_desc: "Show on a hungry tamed animal where it stands in the feeding order."
gcff_hover_rank: "Feeding rank $1 of $2"
gcff_hover_waiting: "Letting higher-ranked animals eat first"
gcff_hover_mate: "Mate: Lvl $1"
