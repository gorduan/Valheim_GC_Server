# GC_Futterfolge - Deutsch. Schlüssel mit eigenem Präfix (gcff_).
gck_mod_futterfolge: "Futter-Reihenfolge"
gcff_t_enabled_name: "Futter-Reihenfolge"
gcff_t_enabled_desc: "Zahme Tiere sehen Futter weiter, wenn ein Weg hinführt. Das Tier mit der höchsten Stufe einer Sorte frisst zuerst, dann das nächste."
gcff_t_range_name: "Reichweite"
gcff_t_range_desc: "Faktor auf Valheims Umkreis, in dem Tiere Futter suchen (2 = doppelt so weit)."
gcff_t_wait_name: "Höchstens warten"
gcff_t_wait_desc: "So lange lässt ein Tier ranghöheren den Vortritt, danach frisst es trotzdem. 0 = nie warten."
gcff_t_pregnant_name: "Trächtige zuletzt"
gcff_t_pregnant_desc: "Trächtige Tiere stellen sich hinten an. Für die Zucht brauchen sie kein Futter, so werden zuerst die Tiere satt, die sich paaren können."
gcff_t_partner_name: "Bester Partner"
gcff_t_partner_desc: "Für die Stufe des Jungen zählt der beste satte Partner beim Trächtigwerden, nicht das nächste Tier (mit GC_Tiere)."
gcff_t_wild_name: "Auch wilde Tiere"
gcff_t_wild_desc: "Wilde Tiere sehen Futter beim Zähmen ebenso weit, ohne Reihenfolge."
gcff_t_rank_name: "Rang anzeigen"
gcff_t_rank_desc: "Am hungrigen zahmen Tier anzeigen, an welcher Stelle es beim Fressen steht."
gcff_hover_rank: "Futter-Rang $1 von $2"
gcff_hover_waiting: "Lässt ranghöheren Tieren den Vortritt"
gcff_hover_mate: "Partner: Lvl $1"
