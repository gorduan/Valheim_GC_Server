# GC_Tierarten - Deutsch. Seit 02.11.2026 (Futter von Bär und Hase); überschreibt die gleichnamigen Texte im Kern (server.menu).
gcsv_t_species_tame_bjorn_desc: "Bären fressen Honig und rohes Fleisch (keine Beeren) und lassen sich in 30 Minuten zähmen und anleinen, mit Honig in 15, mit Lox-Fleisch in 20. Dazu: Bärenjunge (ein Drittel so groß und stark), verdorbenes Fleisch verwandelt einen Bären (auch wilde) nach 30 Minuten in einen Aasbären, Sättel für Bär und Aasbär. Standard aus."
gcsv_t_species_tame_hare_desc: "Hasen fressen Jotun-Bläschen und Karotten vom Boden und lassen sich zähmen (mit Jotun-Bläschen 30 Minuten, mit Karotten 60) und anleinen. Gezähmt fliehen sie nicht mehr. Standard aus."

gcsv_t_species_star2_desc: "Prozent-Chance, dass ein Junges oder Ei mit einem Stern zwei bekommt. Der Züchter bekommt eine Meldung."
gcsv_t_species_star3_name: "Drei Sterne aus der Zucht"
gcsv_t_species_star3_desc: "Prozent-Chance auf ein Junges mit drei Sternen, wenn beide Eltern drei Sterne haben (Gorduan: 5 %). Je Elternteil mit einem Stern weniger mal 0,22, mit zwei weniger mal 0,02: zwei Eltern mit zwei Sternen 0,25 %, drei und zwei Sterne 1,1 %, drei und ein Stern 0,1 %. Sicher vererbt werden höchstens zwei Sterne."
gcsv_t_species_star4_name: "Vier Sterne aus der Zucht"
gcsv_t_species_star4_desc: "Prozent-Chance auf ein Junges mit vier Sternen, wenn beide Eltern vier Sterne haben (1 %). Zwei Eltern mit drei Sternen: 0,05 %."
gcsv_t_species_star5_name: "Fünf Sterne aus der Zucht"
gcsv_t_species_star5_desc: "Prozent-Chance auf ein Junges mit fünf Sternen, wenn beide Eltern fünf Sterne haben (0,2 %). Zwei Eltern mit vier Sternen: 0,01 %."
gcsv_t_species_wild_stars_name: "Drei bis fünf Sterne in der Welt"
gcsv_t_species_wild_stars_desc: "Prozent-Chance, dass ein Tier oder Gegner, der in der Welt mit zwei Sternen erscheint, drei hat (Gorduan: 1 %); davon jeder zehnte vier, davon jeder zehnte fünf. Bosse nie. Valheim rechnet Leben, Schaden und Beute mit den Sternen."
gcs_star_born3: "$1 kommt mit drei Sternen zur Welt!"
gcs_star_born4: "$1 kommt mit vier Sternen zur Welt!"
gcs_star_born5: "$1 kommt mit fünf Sternen zur Welt!"
gcs_star_egg3: "Ein besonderes Ei: $1 mit drei Sternen!"
gcs_star_egg4: "Ein besonderes Ei: $1 mit vier Sternen!"
gcs_star_egg5: "Ein besonderes Ei: $1 mit fünf Sternen!"
gcsv_t_species_star_skill_name: "Tierpflege und Sterne"
gcsv_t_species_star_skill_desc: "Die Tierpflege des Züchters vervielfacht alle Stern-Chancen der Zucht bis zu diesem Faktor bei Stufe 100 (Gorduan: 10-fach); dazwischen erst langsam, gegen 100 steil (Stufe 50: 1,8-fach, 75: 4,3-fach, 90: 7,2-fach). Züchter ist, wessen Futter die Mutter zuletzt gefressen hat."

gcs_unbjorn_died: "$1 hat das verdorbene Fleisch nicht überlebt."
gcsv_t_species_unbjorn_death_name: "Bär stirbt am verdorbenen Fleisch"
gcsv_t_species_unbjorn_death_desc: "Prozent-Chance, dass ein Bär nach dem verdorbenen Fleisch stirbt, statt sich in einen Aasbären zu verwandeln (Gorduan: 75 %). Er stirbt wie im Kampf und lässt seine Beute fallen."
gcs_boss_stars: "$1 ($2 Sterne)"
