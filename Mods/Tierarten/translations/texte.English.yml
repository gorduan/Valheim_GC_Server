# GC_Tierarten - English. Since 02.11.2026 (food of bear and hare); overrides the texts of the same name in the core (server.menu).
gcsv_t_species_tame_bjorn_desc: "Bears eat honey and raw meat (no berries) and can be tamed in 30 minutes and leashed, with honey in 15, with lox meat in 20. Also: bear cubs (a third of the size and strength), rotten meat turns a bear (wild ones too) into a Vile after 30 minutes, saddles for bear and Vile. Off by default."
gcsv_t_species_tame_hare_desc: "Hares eat Jotun Puffs and carrots from the ground and can be tamed (30 minutes with Jotun Puffs, 60 with carrots) and leashed. Tamed, they no longer flee. Off by default."

gcsv_t_species_star2_desc: "Percent chance that a young animal or egg with one star gets two. The breeder gets a message."
gcsv_t_species_star3_name: "Three stars from breeding"
gcsv_t_species_star3_desc: "Percent chance of a young with three stars when both parents have three stars (Gorduan: 5 %). Each parent with one star less multiplies by 0.22, with two less by 0.02: two parents with two stars 0.25 %, three and two stars 1.1 %, three and one star 0.1 %. At most two stars are inherited for sure."
gcsv_t_species_star4_name: "Four stars from breeding"
gcsv_t_species_star4_desc: "Percent chance of a young with four stars when both parents have four stars (1 %). Two parents with three stars: 0.05 %."
gcsv_t_species_star5_name: "Five stars from breeding"
gcsv_t_species_star5_desc: "Percent chance of a young with five stars when both parents have five stars (0.2 %). Two parents with four stars: 0.01 %."
gcsv_t_species_wild_stars_name: "Three to five stars in the world"
gcsv_t_species_wild_stars_desc: "Percent chance that an animal or enemy appearing in the world with two stars has three (Gorduan: 1 %); one in ten of those four, one in ten of those five. Never bosses. Valheim scales health, damage and loot with the stars."
gcs_star_born3: "$1 is born with three stars!"
gcs_star_born4: "$1 is born with four stars!"
gcs_star_born5: "$1 is born with five stars!"
gcs_star_egg3: "A special egg: $1 with three stars!"
gcs_star_egg4: "A special egg: $1 with four stars!"
gcs_star_egg5: "A special egg: $1 with five stars!"
gcsv_t_species_star_skill_name: "Animal care and stars"
gcsv_t_species_star_skill_desc: "The breeder's animal care multiplies all star chances from breeding up to this factor at level 100 (Gorduan: 10 times); slowly at first, steep towards 100 (level 50: 1.8 times, 75: 4.3 times, 90: 7.2 times). The breeder is whoever's food the mother ate last."

gcs_unbjorn_died: "$1 did not survive the rotten meat."
gcsv_t_species_unbjorn_death_name: "Bear dies of rotten meat"
gcsv_t_species_unbjorn_death_desc: "Percent chance that a bear dies after the rotten meat instead of turning into a Vile (Gorduan: 75 %). It dies as in a fight and drops its loot."
gcs_boss_stars: "$1 ($2 stars)"
