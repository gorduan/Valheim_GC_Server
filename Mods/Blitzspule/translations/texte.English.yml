# GC_Blitzspule - English. Keys with their own prefix (gcbs_).
gck_mod_blitzspule: "Lightning coils"
gcbs_name: "Lightning Coil $1"
gcbs_desc: "Place next to an Obliterator: diverts a third of its lightning, obliterated items return $1 % of their materials."
gcbs_need_incinerator: "Only within $1 m of an Obliterator"
gcbs_need_previous: "Needs $1 at this Obliterator first"
gcbs_already: "$1 is already at this Obliterator"
gcbs_result: "Lightning coils: $1 % recovered: $2"
gcbs_t_enabled_name: "Lightning coils"
gcbs_t_enabled_desc: "Three lightning coils (Mountain, Mistlands, Deep North) next to the Obliterator divert its lightning: each step of the chain (I, I+II, I+II+III) takes a third of the lightning damage, all three take all of it; duplicate coils do not count. Obliterated items return materials, EpicLoot items also sacrifice products."
gcbs_t_range_name: "Range"
gcbs_t_range_desc: "Distance in meters within which a coil belongs to an Obliterator (like workbench upgrades)."
gcbs_t_rate1_name: "Return coil I"
gcbs_t_rate1_desc: "Share of the crafting materials that obliterated items return when only Lightning Coil I works at the Obliterator (always rounded down)."
gcbs_t_rate2_name: "Return coil II"
gcbs_t_rate2_desc: "Share of the crafting materials with Lightning Coils I and II at the Obliterator (always rounded down)."
gcbs_t_rate3_name: "Return coil III"
gcbs_t_rate3_desc: "Share of the crafting materials with all three Lightning Coils at the Obliterator (always rounded down)."
gcbs_t_epicmin_name: "EpicLoot at least"
gcbs_t_epicmin_desc: "EpicLoot items additionally return a random share between this value and the maximum of their sacrifice products. Coil II raises the lower bound to the middle, the Crafting skill proportionally."
gcbs_t_epicmax_name: "EpicLoot at most"
gcbs_t_epicmax_desc: "With all three coils (I, II, III) at the Obliterator or Crafting 100 for the player at the lever, this value always applies."
