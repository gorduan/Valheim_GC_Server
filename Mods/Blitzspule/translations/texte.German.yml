# GC_Blitzspule - Deutsch. Schlüssel mit eigenem Präfix (gcbs_).
gck_mod_blitzspule: "Blitzspulen"
gcbs_name: "Blitzspule $1"
gcbs_desc: "Neben einen Vernichter stellen: leitet ein Drittel seines Blitzes ab, Vernichtetes gibt $1 % der Baumaterialien zurück."
gcbs_need_incinerator: "Nur in $1 m Nähe eines Vernichters"
gcbs_need_previous: "Braucht erst $1 an diesem Vernichter"
gcbs_already: "$1 steht an diesem Vernichter schon"
gcbs_result: "Blitzspulen: $1 % zurückgewonnen: $2"
gcbs_t_enabled_name: "Blitzspulen"
gcbs_t_enabled_desc: "Drei Blitzspulen (Gebirge, Nebellande, Hoher Norden) am Vernichter leiten seinen Blitz ab: je Stufe der Kette (I, I+II, I+II+III) ein Drittel weniger Blitzschaden, mit allen dreien keiner; doppelte Spulen zählen nicht. Vernichtetes gibt Baumaterialien zurück, EpicLoot-Items auch Opfer-Produkte."
gcbs_t_range_name: "Reichweite"
gcbs_t_range_desc: "Abstand in Metern, in dem eine Spule zu einem Vernichter gehört (wie Werkbank-Aufwertungen)."
gcbs_t_rate1_name: "Rückgabe Spule I"
gcbs_t_rate1_desc: "Anteil der Baumaterialien, den Vernichtetes zurückgibt, wenn am Vernichter nur Blitzspule I wirkt (immer abgerundet)."
gcbs_t_rate2_name: "Rückgabe Spule II"
gcbs_t_rate2_desc: "Anteil der Baumaterialien mit Blitzspule I und II am Vernichter (immer abgerundet)."
gcbs_t_rate3_name: "Rückgabe Spule III"
gcbs_t_rate3_desc: "Anteil der Baumaterialien mit allen drei Blitzspulen am Vernichter (immer abgerundet)."
gcbs_t_epicmin_name: "EpicLoot mindestens"
gcbs_t_epicmin_desc: "EpicLoot-Items geben zusätzlich zufällig zwischen diesem Wert und dem Höchstwert Prozent ihrer Opfer-Produkte zurück. Mit Spule II steigt die Untergrenze auf die Mitte, mit Handwerk anteilig."
gcbs_t_epicmax_name: "EpicLoot höchstens"
gcbs_t_epicmax_desc: "Mit allen drei Spulen (I, II, III) am Vernichter oder Handwerk 100 beim Spieler am Hebel gilt immer dieser Wert."
