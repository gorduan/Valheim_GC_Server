# ValheimPlusPlus - English: settings menu
vpp_title: "ValheimPlusPlus"

vpp_group_storage: "Storage and auto stack"
vpp_group_stations: "Smelter, furnace and more"
vpp_group_nature: "Nature"
vpp_group_food: "Food"

vpp_t_stackfix_name: "Store armor, jewelry and EpicLoot materials"
vpp_t_stackfix_desc: "ValheimPlus stacking takes armor, shields and jewelry (EpicLoot too) again when the chest holds the same item, and also EpicLoot materials (dust, essences, reagents, runestones, shard stones): V+ mistakes them for ammo because of a tag. Weapons, tools and real ammo follow the V+ setting."
vpp_t_hotbar_name: "Protect hotbar"
vpp_t_hotbar_desc: "Items in the top inventory row are never stacked into chests."
vpp_t_itemlock_name: "Lock items"
vpp_t_itemlock_desc: "Alt+left click: white lock (not stored, not sorted, keeps its slot after death). Alt+right click: red lock (also never used for crafting or building). Works in chests and vehicles too."
vpp_t_chestlock_name: "Lock chests for automation"
vpp_t_chestlock_desc: "Alt+L locks a chest for ValheimPlus machines, crafting from chests and auto stack."
vpp_t_linked_name: "Linked chests"
vpp_t_linked_desc: "Alt+K links chests to a main chest. Opening one of them shows the contents of all linked chests one below the other, and you can take and store anywhere. Every chest keeps its own items, even if the mod is ever missing."
vpp_t_stationmenu_name: "Building menu"
vpp_t_stationmenu_desc: "Shift+E at smelters and more: see the contents, take back ore and fuel, add everything. Also at beehives, bird nests and sap extractors: level and harvest."
vpp_t_stationchests_name: "Input and output chests"
vpp_t_stationchests_desc: "Per building: input chests per material and output chests for the ValheimPlus automation, also output chests for beehives, bird nests and sap extractors. Inputs glow green, outputs red, both blue."
vpp_t_treeregrow_name: "Trees grow back"
vpp_t_treeregrow_desc: "Stumps turn back into the same tree after the growth time of its sapling. Building on the stump or removing it stops this."
vpp_t_treeregrowhover_name: "Remaining time on stumps"
vpp_t_treeregrowhover_desc: "The hover text of a stump shows when the tree grows back."
vpp_t_basefood_name: "Less hunger at base"
vpp_t_basefood_desc: "Food lasts longer within range of a workbench or an active ward. The two values below set how much."
vpp_t_basefood_workbench_name: "Workbench range"
vpp_t_basefood_workbench_desc: "Hunger loss is reduced by this much near a workbench. 100 % = no hunger loss."
vpp_t_basefood_ward_name: "Ward range"
vpp_t_basefood_ward_desc: "Hunger loss is reduced by this much inside an active ward you have access to. 100 % = no hunger loss."

vpp_t_itemlock_key_name: "Lock key"
vpp_t_itemlock_key_desc: "Hold this key: left click sets or removes the white lock, right click the red lock."
vpp_t_itemlock_stacking_name: "Never stack into chests"
vpp_t_itemlock_stacking_desc: "Locked items stay in the inventory on place stacks, hold E and V+ auto stack."
vpp_t_itemlock_takeall_name: "Leave them on 'Take all'"
vpp_t_itemlock_takeall_desc: "Locked items in chests and vehicles stay. Tombstones excluded."
vpp_t_itemlock_grave_name: "Back to their slot after death"
vpp_t_itemlock_grave_desc: "When you empty your own tombstone, locked items return to their slot. What lies there moves to a free slot."
vpp_t_itemlock_white_new_name: "White stacks take new items"
vpp_t_itemlock_white_new_desc: "Picked up or crafted items of the same kind go into the white locked stack. Off: their own stack."
vpp_t_itemlock_red_new_name: "Red stacks take new items"
vpp_t_itemlock_red_new_desc: "On: new items of the same kind go into the red locked stack and are locked too. Off: their own stack."
vpp_t_chestlock_key_name: "Key: lock a chest"
vpp_t_chestlock_key_desc: "Look at a chest and press it."
vpp_t_linked_key_name: "Key: link chests"
vpp_t_linked_key_desc: "Look at the main chest and press it, then at every chest that should join. Pressing it on a linked chest again removes it."
vpp_t_linked_distance_name: "Maximum distance to the main chest"
vpp_t_linked_distance_desc: "Chests farther away cannot be linked."
vpp_t_stationchests_distance_name: "Maximum distance to the building"
vpp_t_stationchests_distance_desc: "Chests farther away cannot be assigned."
vpp_t_stationchests_highlight_name: "Highlight chests while the menu is open"
vpp_t_stationchests_highlight_desc: "Assigned chests are colored while the building menu is open."
vpp_t_stationchests_table_name: "EpicLoot enchanting table from chests"
vpp_t_stationchests_table_desc: "The enchanting table also pays from chests: without an assignment like ValheimPlus crafting (Craft from Chest), with input chests (Shift+E at the table) only from those."
vpp_t_treeregrow_override_name: "Fixed waiting time"
vpp_t_treeregrow_override_desc: "0 = growth time of the matching sapling from the game. Above 0 = these minutes of game time for all trees (one Valheim day = 30 minutes)."
vpp_t_treeregrow_fallback_name: "Waiting time without a sapling"
vpp_t_treeregrow_fallback_desc: "For trees without a sapling (e.g. swamp, Ashlands)."
vpp_t_treeregrow_spread_name: "Random spread"
vpp_t_treeregrow_spread_desc: "For fixed times: 0.25 = plus/minus 25 %, so not all trees grow at once."
vpp_t_basefood_access_name: "Only wards with access"
vpp_t_basefood_access_desc: "Only own or permitted wards count. Off: every active ward."
