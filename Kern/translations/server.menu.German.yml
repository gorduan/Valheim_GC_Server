gcsv_group_world: "Bauen"
gcsv_group_animals: "Tiere"
gcsv_group_combat: "Kampf"
gcsv_group_portals: "Portale"
gcsv_group_tools: "Server-Werkzeuge"

gcsv_t_ladder_name: "Leiter"
gcsv_t_ladder_desc: "Senkrechte, stapelbare Leiter im Hammer (Sonstiges, Werkbank). E an den unteren Stufen bringt dich nach oben, an den obersten nach unten; Umschalt+E immer nach unten. Aus: nicht mehr baubar, gebaute Leitern bleiben stehen."
gcsv_t_ladder_cost_name: "Holzkosten pro 2 m Leiter"
gcsv_t_ladder_cost_desc: "Ein Leiterstück ist 1 m hoch und kostet die Hälfte (aufgerundet)."
gcsv_t_ladder_exit_name: "Abstand beim Absteigen"
gcsv_t_ladder_exit_desc: "So weit vor oder hinter der Leiter landest du."

gcsv_t_pickaxe_name: "Spitzhacke: Streitkolben-Schlag"
gcsv_t_pickaxe_desc: "Mittlere Maustaste schlägt mit der Spitzhacke wie mit einem Bronze-Streitkolben (Dreierschlag). Linksklick bleibt der Abbau-Schlag."
gcsv_t_pickaxe_enemy_name: "Schaden gegen Gegner"
gcsv_t_pickaxe_enemy_desc: "In Prozent des Spitzhacken-Schadens. Der letzte Kettenschlag zählt wie beim Streitkolben doppelt."
gcsv_t_pickaxe_ore_name: "Schaden gegen Erz und Gestein"
gcsv_t_pickaxe_ore_desc: "In Prozent des Spitzhacken-Schadens, bei jedem Schlag gleich. Unter 100 %, damit der Kampfschlag nicht zum Abbauen taugt."
gcsv_t_deflect_name: "Parade wirft Geschosse zurück"
gcsv_t_deflect_desc: "Eine perfekte Parade schickt Steine, Felsbrocken und andere feste Geschosse zum Werfer zurück. Magie und Feuerbälle nie."
gcsv_t_deflect_arrows_name: "Auch Pfeile und Bolzen"
gcsv_t_deflect_arrows_desc: "Pfeile und Bolzen fliegen immer zurück, auch Feuer-, Gift- und Frostpfeile."
gcsv_t_deflect_damage_name: "Schaden des zurückgeworfenen Geschosses"
gcsv_t_deflect_damage_desc: "Faktor auf den ursprünglichen Schaden, 1 = gleich."
gcsv_t_bossscale_name: "Boss-Fortschritt automatisch"
gcsv_t_bossscale_desc: "Je besiegtem Hauptboss haben Gegner und Bosse mehr Leben und machen mehr Schaden, addiert. Automatisch: 10 % je Boss mit EpicLoot, sonst 5 %, wenn Leinen oder Tierpflege an sind, sonst 0 % (wie Valheim). Für jeden Spieler zählt sein eigener Fortschritt (mit World Advancement Progression und Guilds_Progress deren Stand, sonst die Welt)."
gcsv_t_bossscale_percent_name: "Prozent je Boss"
gcsv_t_bossscale_percent_desc: "Gilt, wenn „Boss-Fortschritt automatisch“ aus ist: so viel Prozent mehr Leben und Schaden je besiegtem Hauptboss (Eikthyr, Ältester, Bonemass, Moder, Yagluth, Königin, Fader, Kall Mandefimbul)."
gcsv_bossscale_now: "Jetzt: $1 % je Boss, du hast $2 besiegt, also +$3 %."
gcsv_bossscale_rule: "Jetzt: $1 % je Boss."

gcsv_t_portalnames_name: "Server-Liste der Portalnamen"
gcsv_t_portalnames_desc: "Eine gemeinsame Namensliste für alle Spieler. Sie erscheint mit GC_Client im Portal-Dialog neben der eigenen Liste."
gcsv_t_portalnames_editors_name: "Wer die Liste bearbeiten darf"
gcsv_t_portalnames_editors_desc: "Admins oder alle Spieler. Sehen und benutzen können sie immer alle."

gcsv_t_modcheck_name: "Mod-Abgleich"
gcsv_t_modcheck_desc: "Zeigt fehlende oder abweichende Mods im Vergleich zum Server, mit Knopf zum Kopieren. Konsolenbefehl modcheck."
gcsv_t_modcheck_failure_name: "Nach fehlgeschlagener Verbindung zeigen"
gcsv_t_modcheck_failure_desc: "Das Fenster erscheint im Hauptmenü."
gcsv_t_modcheck_join_name: "Nach dem Beitreten zeigen, wenn Mods fehlen"
gcsv_t_modcheck_join_desc: "Einmal pro Sitzung."

gcsv_enum_Admins: "Admins"
gcsv_enum_Everyone: "Alle"

gcsv_pn_title: "Server-Liste"
gcsv_t_leash_name: "Tierleinen"
gcsv_t_leash_desc: "Leine als Item (Haut oder Fell, ab der Wolf-Leine mit Barren, an der Werkbank). Mit ihrer Taste in die Hand nehmen wie eine Waffe: E am gezähmten Tier leint an oder löst, Linksklick schickt das Tier an den angezielten Ort, Rechtsklick lässt es den anvisierten Gegner angreifen. Angeleinte und angebundene Tiere haben je nach Leine +10 % bis +100 % Leben und Schaden. Durch Portale kommt das Tier mit. Jede Stufe hat ihre Mindest- und Höchstlänge: Läuft man, hält das Tier die Mindestlänge, steht man, bewegt es sich frei bis 90 % der Höchstlänge. Bis zur Höchstlänge kostet nichts Haltbarkeit, auch Kämpfen nicht. Bis 15 % darüber dehnt sich die Leine und verliert je Prüfung so viel Haltbarkeit, wie das Tier Leinenlast hat (nach Größe, Kraft und Gewicht: Huhn 0,5, Wildschwein 1, Wolf 1,5, Asksvin 2,5, Elch 3, Lox 3,5; Jungtiere die Hälfte); darüber zieht sie das Tier mit (halb so schnell) und verschleißt weiter. Reißt sie, ist das Tier entwischt, bis man es mit einer Leine wieder einfängt. E an Pfosten, Zäunen und Mauern bindet an: Dort verliert die Leine nur durch direkten Schaden Haltbarkeit und lässt sich mit dem Hammer reparieren. Mit der Leine in der Hand E am angebundenen Tier, oder E am Knoten, nimmt die Leine wieder auf."
gcsv_t_leash_length_name: "Leinenlänge"
gcsv_t_leash_length_desc: "So nah kommt das Tier heran, bis hier hängt die Leine locker. Weiter weg zieht sie, je weiter, desto stärker."
gcsv_t_leash_max_name: "Höchstlänge"
gcsv_t_leash_max_desc: "Zerrt das Tier weiter weg (zu langsam, hinter Hindernissen oder im Kampf), zieht man es hinter sich her (halb so schnell), und die Leine verliert bei jeder Prüfung Haltbarkeit."
gcsv_t_leash_slip_name: "Abrutschen hinter der Zuggrenze"
gcsv_t_leash_slip_desc: "Sicherung: So viele Meter hinter der Zuggrenze (Höchstlänge + 15 %) rutscht die Leine aus der Hand, das Tier ist frei. Das passiert nur, wenn die Leine das Tier nicht nachziehen kann, etwa über eine tiefe Kante."
gcsv_t_leash_interval_name: "Verschleiß je"
gcsv_t_leash_interval_desc: "Je so viele Sekunden über der Höchstlänge verliert die Leine so viel Haltbarkeit, wie das Tier Leinenlast hat. Kämpfen in Reichweite kostet nichts."
gcsv_t_leash_durability_name: "Haltbarkeit pro Stufe"
gcsv_t_leash_durability_desc: "Eine Leine je Biom (Gorduan, 19.10.2026). Stufe 1 (Hirschleder) hat diesen Wert, jede weitere Stufe einmal mehr: mit 30 hat die Elchhaut-Leine (Stufe 7) 210."
gcsv_t_leash_portal_name: "Tiere bei Teleports mitnehmen"
gcsv_t_leash_portal_desc: "Durch Portale und in Dungeons (hinein und hinaus). Aus: Die Leine rutscht aus der Hand, das Tier bleibt zurück."
gcsv_t_leash_chase_name: "Kampf abbrechen ab"
gcsv_t_leash_chase_desc: "Angeleinte Tiere kämpfen, bis der Gegner tot oder so weit von ihnen weg ist. Dann folgen sie wieder dem Spieler. Ein Angriffsbefehl (Rechtsklick mit der Leine in der Hand) geht nur auf Gegner bis zu dieser Entfernung."
gcsv_t_leash_cmd_level_name: "Befehle ab Tier-Stufe"
gcsv_t_leash_cmd_level_desc: "Links- und Rechtsklick mit der Leine in der Hand nimmt ein Tier erst ab dieser Stufe an. Die Stufe haben gezüchtete Tiere (Tierpflege), gezähmte haben 0. Gilt nur, wenn die Tierpflege an ist."
gcsv_t_leash_cmd_cooldown_name: "Pause nach einem Befehl"
gcsv_t_leash_cmd_cooldown_desc: "Je Tier. Sie wird um den Durchschnitt aus Tier-Stufe und halber Tierpflege-Stufe des Spielers in Prozent kürzer: 20 und 20 ergeben 15 % kürzer, ab 100 % gibt es keine Pause."
gcsv_t_leash_loki_name: "Rückkehr von Lokis Trugbildern"
gcsv_t_leash_loki_desc: "Ein getötetes Trugbild (Lokis Blendwerk, nur mit EpicLoot) kehrt nach so vielen Sekunden von selbst zurück, solange das Tier an der Leine hängt. Die Zeit läuft in der Leine weiter, auch wenn man neu anleint. Beim Anleinen und beim Tod meldet Loki, wie lange es noch dauert."
gcsv_t_leash_whistles_name: "Tierpfeifen"
gcsv_t_leash_whistles_desc: "Vier Pfeifen: Edelholz (Werkbank), Eisen, Walkürenpfeife (Schwarzmetall + Donnerstein) und Flammenmetall (Schmiede). Mit der Pfeife in der Hand gelten Linksklick (hinschicken) und Rechtsklick (angreifen) für alle Tiere an deinen Leinen. Bessere Pfeifen verkürzen die Befehlspause (Edelholz −6 % bis Flammenmetall −50 %); nach jedem Pfiff ist die Pfeife 5 s gesperrt. Jedes Tier, das gehorcht, bekommt 5 s mehr Tempo (+3 % bis +25 %), seine Leine nimmt so lange keinen Schaden, und EpicLoot-Verzauberungen der Pfeife wirken mit."
gcsv_t_care_name: "Tierpflege (Skill)"
gcsv_t_care_desc: "Neuer Skill. Erfahrung durch Füttern (nur wer das Futter hingeworfen oder gepflückt hat), Zähmen, Streicheln, Züchten und wenn ein Tier an deiner Leine etwas tötet. Wirkung bis Stufe 100: gezähmte Tiere im Umkreis bis +100 % Leben, Heilung bis 5 Leben + 1 % je Sekunde, bis +50 % Schaden und bis +25 % Tempo; Zähmen bis 200 % schneller. Es zählt der Spieler mit der höchsten Stufe in der Nähe (nicht addiert), angeleinte Tiere bekommen die Stufe ihres Halters. Tiere haben eine Stufe bis 150: aus der Zucht (zufällig zwischen ¾ des Eltern-Durchschnitts und dem höheren Elternteil, plus 0 bis ¼ der Tierpflege des Züchters) und aus Erfahrung im Kampf. Davon behalten sie dauerhaft den halben Bonus (je Stufe +2 % Leben, +1 % Schaden, +0,5 % Tempo, Heilung 0,05 Leben + 0,01 %) und zeigen die Stufe hinter dem Namen."
gcsv_t_care_radius_name: "Umkreis"
gcsv_t_care_radius_desc: "So nah muss ein Spieler sein, damit seine Tierpflege auf zahme Tiere und aufs Zähmen wirkt."
gcsv_t_care_feed_name: "Erfahrung fürs Füttern"
gcsv_t_care_feed_desc: "Wenn ein Tier Futter frisst, das du hingeworfen oder gepflückt hast. Nur du bekommst sie, nicht alle in der Nähe."
gcsv_t_care_feed_cd_name: "Pause beim Füttern"
gcsv_t_care_feed_cd_desc: "So lange gibt dasselbe Tier dir keine Fütter-Erfahrung mehr."
gcsv_t_care_pet_name: "Erfahrung fürs Streicheln"
gcsv_t_care_pet_desc: "E an einem zahmen Tier ohne Leine in der Hand."
gcsv_t_care_pet_cd_name: "Pause beim Streicheln"
gcsv_t_care_pet_cd_desc: "Je Tier und Spieler (Gorduan: 30 Minuten). Gezählt wird die Zeit der Welt, gespeichert beim Spieler."
gcsv_t_care_tame_name: "Erfahrung fürs Zähmen"
gcsv_t_care_tame_desc: "Für den, dessen Futter das Tier zuletzt gefressen hat, sonst den nächsten Spieler. Ohne Pause."
gcsv_t_care_breed_name: "Erfahrung fürs Züchten"
gcsv_t_care_breed_desc: "Für den Züchter (wessen Futter das Muttertier zuletzt gefressen hat), wenn ein Junges geboren oder ein Ei gelegt wird."
gcsv_t_care_kill_name: "Erfahrung je Beute"
gcsv_t_care_kill_desc: "Wenn ein Tier an deiner Leine etwas tötet, mal Stufe des Opfers (1 Stern doppelt, 2 Sterne dreifach)."
gcsv_t_care_delay_name: "Zögern beim Losgehen"
gcsv_t_care_delay_desc: "Läuft der Halter los, zögert ein Tier an der Leine zufällig bis zu so vielen Sekunden (freier Wille) und streift so lange weiter herum, dann folgt es. Je höher die Mischstufe aus Tier-Stufe und halber Tierpflege des Halters (1:2), desto kürzer."
gcsv_t_care_delay_level_name: "Sofort folgen ab Mischstufe"
gcsv_t_care_delay_level_desc: "Mischstufe = (Tier-Stufe + 2 × halbe Tierpflege des Halters) ÷ 3. Ab diesem Wert folgt ein Tier an der Leine ohne Zögern, darunter zögert es anteilig länger."
gcsv_t_care_xp_name: "Erfahrung der Tiere"
gcsv_t_care_xp_desc: "Zahme Tiere sammeln im Kampf Erfahrung und steigen bis Stufe 150 auf. Je Stufe so viel wie bei Valheims Waffen-Skills: 1 bei Stufe 1, 17 bei 10, 178 bei 50, 501 bei 100, 920 bei 150. Niedrige Tiere steigen schnell, hohe langsam."
gcsv_t_care_xp_factor_name: "Tempo der Tier-Erfahrung"
gcsv_t_care_xp_factor_desc: "1 = wie Valheims Waffen-Skills, 2 = doppelt so schnell, 0,5 = halb so schnell."
gcsv_t_care_xp_kill_name: "Tier-Erfahrung fürs Töten"
gcsv_t_care_xp_kill_desc: "Mal Stufe des Opfers (ohne Stern 5, 1 Stern 10, 2 Sterne 15). Dazu kommt wie bei Waffen 1 je Angriff, der einen Gegner trifft. Nur Monster und wilde Tiere zählen."
gcsv_t_breed_name: "Zuchtgrenze"
gcsv_t_breed_desc: "Valheim lässt Tiere nur Junge bekommen, solange im Umkreis nicht zu viele ihrer Art stehen (z. B. 4 Wölfe in 10 m; Junge und wilde Tiere zählen mit, bei Hühnern Hennen und Eier). Hier steigt die Grenze, und Tiere an Leinen zählen weniger. Aus: wie Valheim."
gcsv_t_breed_factor_name: "Grenze"
gcsv_t_breed_factor_desc: "Faktor auf Valheims Grenze je Tierart, z. B. 1,5: aus 4 Wölfen werden 6. Nicht für Hühner."
gcsv_t_breed_radius_name: "Umkreis"
gcsv_t_breed_radius_desc: "Faktor auf Valheims Umkreis, in dem gezählt wird (1 = wie Valheim, z. B. 10 m bei Wölfen). Nicht für Hühner."
gcsv_t_breed_leashed_name: "Tier an der Leine zählt"
gcsv_t_breed_leashed_desc: "So viel zählt ein Tier an einer Leine oder an einem Pfosten: 0,5 = halb, 1 = voll wie Valheim. Nicht für Hühner."
gcsv_t_breed_chicken_factor_name: "Hühner: Grenze"
gcsv_t_breed_chicken_factor_desc: "Faktor auf Valheims Grenze für Hennen (gezählt werden Hennen und gelegte Eier, Küken nicht). 1 = wie Valheim."
gcsv_t_breed_chicken_radius_name: "Hühner: Umkreis"
gcsv_t_breed_chicken_radius_desc: "Faktor auf Valheims Umkreis für Hennen. 1 = wie Valheim."
gcsv_t_breed_chicken_leashed_name: "Hühner: Henne an der Leine zählt"
gcsv_t_breed_chicken_leashed_desc: "So viel zählt eine Henne an einer Leine oder an einem Pfosten. 1 = voll wie Valheim."
gcsv_group_farming: "Felder"
gcsv_t_fields_name: "Felder für den Kultivator"
gcsv_t_fields_desc: "Im Kultivator-Menü „Feld markieren“: Fläche aus Eckpunkten anlegen, darin pflanzt der Kultivator in Reihen, E halten bepflanzt nach und nach. Zeichnen und Pflanzen braucht GC_Client."
gcsv_t_fields_remove_name: "Wer Felder aufheben darf"
gcsv_t_fields_remove_desc: "Alle, Ersteller und Admins, Ersteller mit Gildenleitung und Admins oder nur Admins. Ohne Gilden-Mod zählt die Gildenleitung nicht. Die Pflanzen bleiben immer stehen."
gcsv_t_fields_points_name: "Höchstzahl Eckpunkte"
gcsv_t_fields_points_desc: "Je Feld, 0 = unbegrenzt."
gcsv_t_fields_edge_name: "Höchstlänge einer Kante"
gcsv_t_fields_edge_desc: "In Metern, 0 = unbegrenzt."
gcsv_t_fields_reach_name: "Reichweite beim Pflanzen"
gcsv_t_fields_reach_desc: "So weit vom Spieler werden Plätze im Feld bepflanzt. Man kann sich dabei bewegen."
gcsv_t_fields_interval_name: "Pause beim Halten von E"
gcsv_t_fields_interval_desc: "Sekunden zwischen zwei Pflanzen. Valheim selbst braucht mindestens 0,4 s."
gcsv_t_fields_bush_name: "Abstand Sträucher"
gcsv_t_fields_bush_desc: "Für Sträucher ohne eigene Wachstumsregel, etwa Beerensträucher aus PlantEverything."
gcsv_t_fields_mushroom_name: "Abstand Pilze"
gcsv_t_fields_mushroom_desc: "Für Pilze ohne eigene Wachstumsregel."
gcsv_t_fields_other_name: "Abstand Sonstiges"
gcsv_t_fields_other_desc: "Für Blumen, Disteln und alles andere ohne eigene Wachstumsregel."
gcsv_enum_CreatorOrAdmin: "Ersteller und Admins"
gcsv_enum_CreatorGuildLeadersOrAdmin: "Ersteller, Gildenleitung und Admins"
gcsv_enum_AdminOnly: "Nur Admins"
gcsv_group_transport: "Transport"
gcsv_t_courier_name: "Walküren-Transport"
gcsv_t_courier_desc: "Walkürenpfeife (Schwarzmetall + Donnerstein, Schmiede) höchstens 1 m neben einem Karren mit Loxfleisch und Ymir-Fleisch: Eine Walküre holt ihn ab, auch mit Fracht, die nicht durchs Portal darf. Der nächste Pfiff ruft ihn dorthin, wo man steht. Je Spieler ist ein Karren unterwegs."
gcsv_t_courier_meat_name: "Loxfleisch im Karren"
gcsv_t_courier_meat_desc: "So viel rohes Loxfleisch muss im Karren liegen. Die Walküre nimmt es sich, der Rest der Fracht kommt an."
gcsv_t_courier_ymir_name: "Ymir-Fleisch im Karren"
gcsv_t_courier_ymir_desc: "So viel Ymir-Fleisch muss zusätzlich im Karren liegen. Die Walküre nimmt es mit dem Loxfleisch."
gcsv_t_courier_raid_name: "Raid nach dem Abholen"
gcsv_t_courier_raid_desc: "Ist die Walküre fort, beginnt am Karren ein Raid, der in der Welt gerade möglich ist, auch ohne Gebäude in der Nähe. Mit Easteregg: Kampfhühner."
gcsv_t_courier_easter_name: "Easteregg"
gcsv_t_courier_easter_desc: "Das Abholen wird völlig übertrieben (Lärm, Blitze, Beben, Feuer am Himmel; kein zusätzlicher Schaden). Statt der Walküre kommt eine Möwe, und danach greifen Kampfhühner an. Das Abliefern bleibt gleich."
gcsv_group_species: "Tierarten"
gcsv_t_species_cap_name: "Grenze eigene Stufe + Pfleger"
gcsv_t_species_cap_desc: "Für die Boni zählen die halbe eigene Stufe des Tiers und die Tierpflege des Pflegers zusammen höchstens so viel (Gorduan: 150). Alle Stufen-Boni sind mit 5/12 gerechnet: ein Lox mit 2 Sternen, Stufe 300, Pfleger 100 und Elchhaut-Leine Q4 hat höchstens 10.000 Leben (9.750) und 683 Biss-Schaden."
gcsv_t_species_star1_name: "Stern-Chance 0 → 1"
gcsv_t_species_star1_desc: "Prozent-Chance, dass ein Junges oder Ei, das ohne Stern wäre, einen Stern bekommt. Der Züchter bekommt eine Meldung."
gcsv_t_species_star2_name: "Stern-Chance 1 → 2"
gcsv_t_species_star2_desc: "Prozent-Chance, dass ein Junges oder Ei mit einem Stern zwei bekommt. Höchstens ein Stern mehr je Geburt."
gcsv_t_species_max_wolf_name: "Höchststufe Wolf und Welpe"
gcsv_t_species_max_wolf_desc: "So hoch steigt die Stufe durch Zucht und Erfahrung (Standard 200). Je höher, desto stärker wird das Tier, aber sehr langsam."
gcsv_t_species_max_lox_name: "Höchststufe Lox und Kalb"
gcsv_t_species_max_lox_desc: "So hoch steigt die Stufe durch Zucht und Erfahrung (Standard 300). Je höher, desto stärker wird das Tier, aber sehr langsam."
gcsv_t_species_max_boar_name: "Höchststufe Wildschwein und Ferkel"
gcsv_t_species_max_boar_desc: "So hoch steigt die Stufe durch Zucht und Erfahrung (Standard 150). Je höher, desto stärker wird das Tier, aber sehr langsam."
gcsv_t_species_max_hen_name: "Höchststufe Henne und Küken"
gcsv_t_species_max_hen_desc: "So hoch steigt die Stufe durch Zucht und Erfahrung (Standard 150). Je höher, desto stärker wird das Tier, aber sehr langsam."
gcsv_t_species_max_asksvin_name: "Höchststufe Asksvin und Junges"
gcsv_t_species_max_asksvin_desc: "So hoch steigt die Stufe durch Zucht und Erfahrung (Standard 150). Je höher, desto stärker wird das Tier, aber sehr langsam."
gcsv_t_species_max_moose_name: "Höchststufe Elch und Kalb"
gcsv_t_species_max_moose_desc: "So hoch steigt die Stufe durch Zucht und Erfahrung (Standard 150). Je höher, desto stärker wird das Tier, aber sehr langsam."
gcsv_t_species_max_bjorn_name: "Höchststufe Bär und Bärenjunges"
gcsv_t_species_max_bjorn_desc: "So hoch steigt die Stufe durch Zucht und Erfahrung (Standard 200). Je höher, desto stärker wird das Tier, aber sehr langsam."
gcsv_t_species_max_unbjorn_name: "Höchststufe Unbjørn"
gcsv_t_species_max_unbjorn_desc: "So hoch steigt die Stufe durch Zucht und Erfahrung (Standard 300). Je höher, desto stärker wird das Tier, aber sehr langsam."
gcsv_t_species_max_neck_name: "Höchststufe Nixe"
gcsv_t_species_max_neck_desc: "So hoch steigt die Stufe durch Zucht und Erfahrung (Standard 150). Je höher, desto stärker wird das Tier, aber sehr langsam."
gcsv_t_species_max_deer_name: "Höchststufe Hirsch"
gcsv_t_species_max_deer_desc: "So hoch steigt die Stufe durch Zucht und Erfahrung (Standard 150). Je höher, desto stärker wird das Tier, aber sehr langsam."
gcsv_t_species_max_hare_name: "Höchststufe Hase"
gcsv_t_species_max_hare_desc: "So hoch steigt die Stufe durch Zucht und Erfahrung (Standard 150). Je höher, desto stärker wird das Tier, aber sehr langsam."
gcsv_t_species_max_seal_name: "Höchststufe Robbe"
gcsv_t_species_max_seal_desc: "So hoch steigt die Stufe durch Zucht und Erfahrung (Standard 150). Je höher, desto stärker wird das Tier, aber sehr langsam."
gcsv_t_species_max_other_name: "Höchststufe andere Tiere"
gcsv_t_species_max_other_desc: "So hoch steigt die Stufe durch Zucht und Erfahrung (Standard 150). Je höher, desto stärker wird das Tier, aber sehr langsam."
gcsv_t_species_tame_bjorn_name: "Bären zähmbar"
gcsv_t_species_tame_bjorn_desc: "Bären fressen Honig, Himbeeren, Blaubeeren und Wolkenbeeren und lassen sich in 30 Minuten zähmen und anleinen. Dazu: Bärenjunge (ein Drittel so groß und stark), verrottetes Fleisch verwandelt einen Bären (auch wilde) nach 30 Minuten in einen Unbjørn, Sättel für Bär und Unbjørn. Standard aus."
gcsv_t_species_tame_neck_name: "Nixen zähmbar"
gcsv_t_species_tame_neck_desc: "Nixen fressen rohen Fisch und lassen sich in 30 Minuten zähmen und anleinen. Standard aus."
gcsv_t_species_tame_deer_name: "Hirsche zähmbar"
gcsv_t_species_tame_deer_desc: "Hirsche fressen Himbeeren, Blaubeeren und Pilze vom Boden (nur wenn kein Spieler sie verscheucht) und lassen sich in 30 Minuten zähmen und anleinen. Gezähmt fliehen sie nicht mehr. Standard aus."
gcsv_t_species_tame_hare_name: "Hasen zähmbar"
gcsv_t_species_tame_hare_desc: "Hasen fressen Pilze vom Boden (rote, gelbe, Jotunnbovist) und lassen sich in 30 Minuten zähmen und anleinen. Gezähmt fliehen sie nicht mehr. Standard aus."
gcsv_t_species_tame_seal_name: "Robben zähmbar"
gcsv_t_species_tame_seal_desc: "Robben fressen rohen Fisch vom Boden und lassen sich in 30 Minuten zähmen und anleinen. Gezähmt fliehen sie nicht mehr. Standard aus."
