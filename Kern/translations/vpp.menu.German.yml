# ValheimPlusPlus - Deutsch: Einstellungsmenü
vpp_title: "ValheimPlusPlus"

vpp_group_storage: "Lager und Auto-Stack"
vpp_group_stations: "Schmelze, Ofen und Co."
vpp_group_nature: "Natur"
vpp_group_food: "Essen"

vpp_t_stackfix_name: "Rüstung, Schmuck und EpicLoot-Materialien einlagern"
vpp_t_stackfix_desc: "ValheimPlus-Stapeln nimmt Rüstung, Schilde und Schmuck (auch EpicLoot) wieder mit, wenn die Kiste dasselbe Item enthält, ebenso EpicLoot-Materialien (Staub, Essenzen, Reagenzien, Runen- und Splittersteine): V+ hält sie wegen eines Kennzeichens für Munition. Waffen, Werkzeuge und echte Munition folgen der V+-Einstellung."
vpp_t_hotbar_name: "Schnellleiste schützen"
vpp_t_hotbar_desc: "Items in der obersten Inventarreihe landen beim Stapeln nie in Kisten."
vpp_t_itemlock_name: "Items fixieren"
vpp_t_itemlock_desc: "Alt+Linksklick: weißes Schloss (nicht einlagern, nicht sortieren, Platz bleibt nach dem Tod). Alt+Rechtsklick: rotes Schloss (zusätzlich nie zum Craften oder Bauen). Auch in Kisten und Fahrzeugen."
vpp_t_chestlock_name: "Kisten für Automatik sperren"
vpp_t_chestlock_desc: "Alt+L sperrt eine Kiste für ValheimPlus-Maschinen, Craften aus Kisten und Auto-Stack."
vpp_t_linked_name: "Verbundene Kisten"
vpp_t_linked_desc: "Alt+K verbindet Kisten mit einer Hauptkiste. Öffnest du eine davon, siehst du den Inhalt aller verbundenen Kisten untereinander und kannst überall entnehmen und ablegen. Jede Kiste behält ihre eigenen Items, auch wenn die Mod einmal fehlt."
vpp_t_stationmenu_name: "Gebäude-Menü"
vpp_t_stationmenu_desc: "Umschalt+E an Schmelze und Co.: Inhalt sehen, Erz und Brennstoff zurücknehmen, alles einfüllen. Auch an Bienenstock, Vogelnest und Saftzapfer: Füllstand und Ernte."
vpp_t_stationchests_name: "Ein- und Ausgangskisten"
vpp_t_stationchests_desc: "Pro Gebäude eigene Eingangskisten je Rohstoff und eigene Ausgangskisten für die ValheimPlus-Automatik, auch Ausgangskisten für Bienenstock, Vogelnest und Saftzapfer. Eingang leuchtet grün, Ausgang rot, beides blau."
vpp_t_treeregrow_name: "Bäume wachsen nach"
vpp_t_treeregrow_desc: "Baumstümpfe werden nach der Wachstumszeit ihres Setzlings wieder zum selben Baum. Bauen auf dem Stumpf oder Roden verhindert das."
vpp_t_treeregrowhover_name: "Restzeit an Baumstümpfen"
vpp_t_treeregrowhover_desc: "Der Hover-Text eines Stumpfs zeigt, wann der Baum nachwächst."
vpp_t_basefood_name: "Weniger Hunger in der Basis"
vpp_t_basefood_desc: "Essen hält länger im Bereich einer Werkbank oder eines aktiven Wächtersteins. Wie viel, stellen die beiden Werte darunter ein."
vpp_t_basefood_workbench_name: "Bereich der Werkbank"
vpp_t_basefood_workbench_desc: "Um so viel sinkt der Hungerverlust in der Nähe einer Werkbank. 100 % = kein Hungerverlust."
vpp_t_basefood_ward_name: "Bereich des Wächtersteins"
vpp_t_basefood_ward_desc: "Um so viel sinkt der Hungerverlust in einem aktiven Wächterstein, auf den du Zugriff hast. 100 % = kein Hungerverlust."

vpp_t_itemlock_key_name: "Taste für das Schloss"
vpp_t_itemlock_key_desc: "Diese Taste halten: Linksklick setzt oder löst das weiße Schloss, Rechtsklick das rote."
vpp_t_itemlock_stacking_name: "Nicht in Kisten stapeln"
vpp_t_itemlock_stacking_desc: "Fixierte Items bleiben bei Stapel ablegen, E halten und V+ Auto-Stack im Inventar."
vpp_t_itemlock_takeall_name: "Bei 'Alles nehmen' in der Kiste lassen"
vpp_t_itemlock_takeall_desc: "Fixierte Items in Kisten und Fahrzeugen bleiben liegen. Grabsteine ausgenommen."
vpp_t_itemlock_grave_name: "Nach dem Tod auf den alten Platz"
vpp_t_itemlock_grave_desc: "Beim Leeren des eigenen Grabsteins kommen fixierte Items auf ihren Platz. Was dort liegt, rückt auf einen freien Platz."
vpp_t_itemlock_white_new_name: "Weiße Stapel nehmen neue Items auf"
vpp_t_itemlock_white_new_desc: "Aufgehobene oder gecraftete Items gleicher Art landen im weiß fixierten Stapel. Aus: eigener Stapel."
vpp_t_itemlock_red_new_name: "Rote Stapel nehmen neue Items auf"
vpp_t_itemlock_red_new_desc: "An: Neue Items gleicher Art landen im rot fixierten Stapel und sind dann auch gesperrt. Aus: eigener Stapel."
vpp_t_chestlock_key_name: "Taste: Kiste sperren"
vpp_t_chestlock_key_desc: "Auf eine Kiste schauen und drücken."
vpp_t_linked_key_name: "Taste: Kisten verbinden"
vpp_t_linked_key_desc: "Auf die Hauptkiste schauen und drücken, dann auf jede Kiste, die dazugehören soll. Nochmal auf einer verbundenen Kiste drücken löst sie."
vpp_t_linked_distance_name: "Größte Entfernung zur Hauptkiste"
vpp_t_linked_distance_desc: "Weiter entfernte Kisten lassen sich nicht verbinden."
vpp_t_stationchests_distance_name: "Größte Entfernung zum Gebäude"
vpp_t_stationchests_distance_desc: "Weiter entfernte Kisten lassen sich nicht zuweisen."
vpp_t_stationchests_highlight_name: "Kisten leuchten bei offenem Menü"
vpp_t_stationchests_highlight_desc: "Zugewiesene Kisten werden farbig markiert, solange das Gebäude-Menü offen ist."
vpp_t_treeregrow_override_name: "Feste Wartezeit"
vpp_t_treeregrow_override_desc: "0 = Wachstumszeit des passenden Setzlings aus dem Spiel. Größer 0 = diese Minuten Spielzeit für alle Bäume (ein Valheim-Tag = 30 Minuten)."
vpp_t_treeregrow_fallback_name: "Wartezeit ohne Setzling"
vpp_t_treeregrow_fallback_desc: "Für Bäume, die keinen Setzling haben (z. B. Sumpf, Ashlands)."
vpp_t_treeregrow_spread_name: "Zufällige Abweichung"
vpp_t_treeregrow_spread_desc: "Für feste Zeiten: 0,25 = plus/minus 25 %, damit nicht alle Bäume gleichzeitig wachsen."
vpp_t_basefood_access_name: "Nur Wächtersteine mit Zugriff"
vpp_t_basefood_access_desc: "Zählen nur eigene oder freigegebene Wächtersteine. Aus: jeder aktive Wächterstein."
