# GC_Client - Deutsch: Abschnitt im Menü GC Option
gccm_title: "GC Client (nur für dich)"

gccm_group_inventory: "Inventar und Kisten"
gccm_group_world: "Welt"
gccm_group_portals: "Portale"
gccm_group_map: "Karte"

gccm_t_trash_name: "Vernichten"
gccm_t_trash_desc: "Button 'Vernichten' am Inventar und eine Taste über einem Item. Angelegte und fixierte Items nie."
gccm_t_trash_confirm_name: "Vor dem Vernichten nachfragen"
gccm_t_trash_confirm_desc: "Rückfrage, bevor ein Item endgültig weg ist."
gccm_t_trash_button_name: "Button am Inventar anzeigen"
gccm_t_trash_button_desc: "Ohne Button geht es nur über die Taste."
gccm_t_trash_key_name: "Taste: Item unter dem Mauszeiger vernichten"
gccm_t_trash_key_desc: "Im Inventar oder in einer Kiste."

gccm_t_sort_name: "Sortieren"
gccm_t_sort_desc: "Sortieren-Buttons an Inventar und Kisten. Schnellleiste und fixierte Items bleiben stehen."
gccm_t_sort_mode_name: "Sortieren nach"
gccm_t_sort_mode_desc: "Kategorie, Name, Gewicht (schwerste zuerst) oder Wert (wertvollste zuerst)."
gccm_t_sort_hotbar_name: "Schnellleiste nicht sortieren"
gccm_t_sort_hotbar_desc: "Die oberste Reihe (Tasten 1 bis 8) bleibt, wie sie ist."
gccm_t_sort_merge_name: "Angebrochene Stapel zusammenführen"
gccm_t_sort_merge_desc: "Gleiche Items werden beim Sortieren zu vollen Stapeln."
gccm_t_sort_key_player_name: "Taste: Inventar sortieren"
gccm_t_sort_key_player_desc: "Bei offenem Inventar. Keine Taste = nur der Button."
gccm_t_sort_key_container_name: "Taste: Kiste sortieren"
gccm_t_sort_key_container_desc: "Bei offener Kiste. Keine Taste = nur der Button."

gccm_t_quicktake_name: "Kiste leeren mit Umschalt+E"
gccm_t_quicktake_desc: "Umschalt halten und eine Kiste, einen Karren oder ein Schiff benutzen: nimmt alles, ohne zu öffnen. E halten bleibt wie in Vanilla (Stapel ablegen). Bei verbundenen Kisten nur die angeschaute."
gccm_t_quicktake_key_name: "Taste zum Halten"
gccm_t_quicktake_key_desc: "Diese Taste halten und die Kiste benutzen."

gccm_t_carrylimit_name: "Traglimit"
gccm_t_carrylimit_desc: "Nimmt von einem Stapel nur so viel, wie du noch tragen kannst. Am Boden mit Umschalt+E, in Kisten mit Strg+Linksklick. Der Rest bleibt liegen."
gccm_t_carrylimit_mode_name: "Wann aktiv"
gccm_t_carrylimit_mode_desc: "Halten: nur solange die Taste gedrückt ist (Standard Umschalt, also Umschalt+E). Umschalten: Taste schaltet an und aus. Immer: immer aktiv."
gccm_t_carrylimit_key_name: "Taste"
gccm_t_carrylimit_key_desc: "Für Halten und Umschalten."
gccm_t_carrylimit_auto_name: "Auch beim automatischen Aufheben"
gccm_t_carrylimit_auto_desc: "In den Modi Umschalten und Immer: nimmt Teilstapel, statt zu schwere Stapel liegen zu lassen. Im Modus Halten nicht, sonst würde jedes Rennen mit Umschalt Teilstapel aufheben."
gccm_t_carrylimit_chest_name: "Strg+Linksklick in Kisten mit Traglimit"
gccm_t_carrylimit_chest_desc: "Strg+Linksklick verschiebt in Vanilla den ganzen Stapel ins Inventar. Hiermit nur so viel, wie du tragen kannst, der Rest bleibt in der Kiste."
gccm_t_compare_name: "Ausrüstungs-Vergleich"
gccm_t_compare_desc: "Zeigst du im Inventar, in einer Kiste oder beim Händler auf eine Waffe, einen Schild, Kleidung, Schmuck oder Munition, erscheint daneben ein Feld Ausgerüstet mit dem, was beim Anlegen ersetzt würde. Oben darin die Unterschiede: Gewinn grün, Verlust rot. Ein Zweihänder wird gegen Einhandwaffe und Schild zusammen verglichen."
gccm_t_compare_mode_name: "Wann anzeigen"
gccm_t_compare_mode_desc: "Immer: bei jedem Zeigen auf ein Item. Halten: nur solange die Taste gedrückt ist. Umschalten: die Taste schaltet den Vergleich an und aus."
gccm_t_compare_key_name: "Taste"
gccm_t_compare_key_desc: "Für Halten und Umschalten (Standard Umschalt)."
gccm_t_compare_details_name: "Alle Werte des Ausgerüsteten"
gccm_t_compare_details_desc: "Zeigt unter den Unterschieden den vollständigen Tooltip der ausgerüsteten Items. Aus: nur die Unterschiede."

gccm_t_cartcollect_name: "Einsammeln ins Fahrzeug"
gccm_t_cartcollect_desc: "Aufgehobenes Material wandert in einen nahen Karren oder ein Schiff, in dem dasselbe Material liegt. Respektiert Guilds_Vehicle."
gccm_t_cartcollect_range_name: "Suchradius"
gccm_t_cartcollect_range_desc: "So weit um dich herum wird nach Fahrzeugen gesucht."
gccm_t_cartcollect_matching_name: "Nur Material, das schon im Fahrzeug liegt"
gccm_t_cartcollect_matching_desc: "Aus: alles, wofür im Fahrzeug Platz ist."
gccm_t_cartcollect_ships_name: "Auch Schiffe befüllen"
gccm_t_cartcollect_ships_desc: "Schiffe mit Laderaum zählen als Fahrzeug."
gccm_t_cartcollect_pulling_name: "Karren nur beim Ziehen befüllen"
gccm_t_cartcollect_pulling_desc: "Abgestellte Karren bleiben unberührt."
gccm_t_cartcollect_key_name: "Taste zum Pausieren"
gccm_t_cartcollect_key_desc: "Schaltet das Einsammeln kurz an und aus."

gccm_t_massharvest_name: "Umkreis-Ernte"
gccm_t_massharvest_desc: "E über etwas Aufsammelbarem halten sammelt im Umkreis mehr von derselben Sorte ein (E auf Gold: nur Gold). Feldfrüchte immer, alles andere, wenn eingeschaltet."
gccm_t_massharvest_radius_name: "Radius"
gccm_t_massharvest_radius_desc: "Umkreis um die anvisierte Pflanze."
gccm_t_massharvest_max_name: "Pflanzen pro Schritt"
gccm_t_massharvest_max_desc: "Höchstens so viele Pflanzen alle 0,2 Sekunden."
gccm_t_massharvest_all_name: "Alles Aufsammelbare"
gccm_t_massharvest_all_desc: "Nicht nur Feldfrüchte: auch Büsche, wilde Pflanzen, Pilze, Steine, Feuerstein, Äste, Schätze, Lager-Beute und liegende Gegenstände."
gccm_t_massharvest_same_name: "Nur dieselbe Sorte"
gccm_t_massharvest_same_desc: "Nur Pflanzen wie die anvisierte ernten."
gccm_t_massharvest_hold_name: "Nur beim Gedrückthalten"
gccm_t_massharvest_hold_desc: "Ein einzelner Druck erntet wie Vanilla nur eine Pflanze."

gccm_t_autodoor_name: "Automatische Türen"
gccm_t_autodoor_desc: "Türen öffnen und schließen sich von selbst, außer bei Gegnern in der Nähe oder einem Raid. Krypta-Türen und fremde Wards nie."
gccm_t_autodoor_open_name: "Öffnen ab Abstand"
gccm_t_autodoor_open_desc: "Die Tür öffnet sich, wenn du näher kommst."
gccm_t_autodoor_close_name: "Schließen ab Abstand"
gccm_t_autodoor_close_desc: "Die Tür schließt sich, wenn alle Spieler weiter weg sind."
gccm_t_autodoor_enemy_name: "Gegner-Abstand"
gccm_t_autodoor_enemy_desc: "Keine Automatik, solange ein Gegner in diesem Umkreis ist."
gccm_t_autodoor_raid_name: "Bei Raids aussetzen"
gccm_t_autodoor_raid_desc: "Keine Automatik während eines Raids in deiner Nähe."
gccm_t_autodoor_danger_name: "Bei Gefahr schließen"
gccm_t_autodoor_danger_desc: "Schließt die von der Mod geöffneten Türen, sobald niemand im Durchgang steht."
gccm_t_autodoor_key_name: "Taste zum Pausieren"
gccm_t_autodoor_key_desc: "Schaltet die Automatik kurz an und aus."

gccm_t_portalguard_name: "Portalnamen-Schutz"
gccm_t_portalguard_desc: "Rückfrage vor jeder Umbenennung. Eine unveränderte Bestätigung trennt keine Verbindung mehr. Leere Namen sind wie in Vanilla erlaubt."
gccm_t_portalguard_confirm_name: "Vor dem Umbenennen nachfragen"
gccm_t_portalguard_confirm_desc: "Gilt für benannte Portale. Ein Klick in der Portalnamen-Liste fragt nicht nach."
gccm_t_portalguard_key_name: "Taste: alten Namen wiederherstellen"
gccm_t_portalguard_key_desc: "Halten und das Portal benutzen (Standard Umschalt+E). E allein öffnet weiter den Umbenennen-Dialog."

gccm_t_portalnames_name: "Portalnamen-Liste"
gccm_t_portalnames_desc: "Beim Umbenennen eines Portals erscheint daneben eine Liste gemerkter Namen. Mit GC_Server und GC_Guilds kommen Server- und Gildenlisten dazu."
gccm_t_portalnames_click_name: "Klick benennt sofort um"
gccm_t_portalnames_click_desc: "Aus: Der Name wird nur ins Eingabefeld geschrieben."

gccm_t_compass_name: "Kompass"
gccm_t_compass_desc: "Leiste oben am Bildschirm mit Himmelsrichtungen und Kartenmarkierungen. Alt + Linksklick auf eine Markierung der großen Karte macht sie zum Ziel: golden auf der Karte und im Kompass immer hervorgehoben, liegt sie hinter dir, am Rand. Pings von Spielern erscheinen blau, solange Valheim sie zeigt. Auch Händler und Orte mit Kartensymbol. Andere Markierungen werden mit der Entfernung kleiner und blasser. Was im Kartenfilter aus ist, fehlt auch hier."
gccm_t_compass_focus_key_name: "Taste: Ziel wählen"
gccm_t_compass_focus_key_desc: "Halten und auf der großen Karte eine Markierung anklicken. Nochmal klicken oder auf eine leere Stelle klicken hebt das Ziel auf. Das Ziel bleibt am Charakter gespeichert, je Welt."
gccm_t_compass_width_name: "Breite"
gccm_t_compass_width_desc: "Anteil der Bildschirmbreite."
gccm_t_compass_fov_name: "Sichtbereich"
gccm_t_compass_fov_desc: "So viel Grad zeigt die Leiste. 180° = von West bis Ost, wenn du nach Norden schaust."
gccm_t_compass_offset_name: "Abstand vom oberen Rand"
gccm_t_compass_offset_desc: "In Pixeln, z. B. wenn die Leiste etwas anderes verdeckt."
gccm_t_compass_scale_name: "Größe"
gccm_t_compass_scale_desc: "Symbole und Schrift."
gccm_t_compass_range_name: "Reichweite anderer Markierungen"
gccm_t_compass_range_desc: "Weiter entfernte Markierungen fehlen. Ziel und Pings stehen immer im Kompass."
gccm_t_compass_names_name: "Namen anderer Markierungen"
gccm_t_compass_names_desc: "Immer, nur nahe (Entfernung darunter) oder nie. Ziel und Pings zeigen ihren Namen immer, andere Namen weichen ihnen aus."
gccm_t_compass_name_range_name: "Namen bis"
gccm_t_compass_name_range_desc: "Entfernung für „Nur nahe“."
gccm_t_compass_distance_name: "Entfernung anzeigen"
gccm_t_compass_distance_desc: "Bei Ziel und Pings in Metern oder Kilometern."
gccm_t_compass_checked_name: "Abgehakte Markierungen zeigen"
gccm_t_compass_checked_desc: "Auf der Karte durchgestrichene Markierungen, blasser. Das Ziel steht immer im Kompass."
gccm_t_compass_players_name: "Mitspieler zeigen"
gccm_t_compass_players_desc: "Spieler, die auf der Karte sichtbar sind."
gccm_t_compass_icons_name: "Symbole"
gccm_t_compass_icons_desc: "Kartensymbol oder einfacher Punkt."

gccm_t_dungeonmap_name: "Dungeon-Karte"
gccm_t_dungeonmap_desc: "Im Dungeon zeichnet eine Karte jeden betretenen Raum. M zeigt sie groß."
gccm_t_dungeonmap_size_name: "Größe der kleinen Karte"
gccm_t_dungeonmap_size_desc: "Seitenlänge oben rechts am Bildschirm."
gccm_t_dungeonmap_zoom_name: "Maßstab"
gccm_t_dungeonmap_zoom_desc: "Pixel pro Meter auf der kleinen Karte."
gccm_t_dungeonmap_minimap_name: "Normale Minimap im Dungeon ausblenden"
gccm_t_dungeonmap_minimap_desc: "Im Dungeon zeigt die Minimap sonst nur die Oberwelt."

gccm_enum_Type: "Kategorie"
gccm_enum_Name: "Name"
gccm_enum_Weight: "Gewicht"
gccm_enum_Value: "Wert"
gccm_enum_Hold: "Halten"
gccm_enum_Toggle: "Umschalten"
gccm_enum_Always: "Immer"
gccm_enum_Near: "Nur nahe"
gccm_enum_Never: "Nie"
gccm_enum_MapIcon: "Kartensymbol"
gccm_enum_Dot: "Punkt"
gccm_group_farming: "Felder"
gccm_t_fields_name: "Felder anzeigen und bepflanzen"
gccm_t_fields_desc: "Mit dem Kultivator: „Feld markieren“, gelbe Flächen sehen, in Reihen pflanzen, E halten bepflanzt nach und nach. Die Regeln gibt der Server vor (GC_Server)."
gccm_t_fields_color_name: "Farbe der Felder"
gccm_t_fields_color_desc: "Farbe von Fläche und Rand. Nachts wird sie automatisch gedämpft."
gccm_t_fields_fill_name: "Deckkraft der Fläche"
gccm_t_fields_fill_desc: "0 % = nur der Rand, 100 % = voll deckend."
gccm_t_fields_line_name: "Deckkraft des Rands"
gccm_t_fields_line_desc: "0 % = ohne Rand, 100 % = voll deckend."
