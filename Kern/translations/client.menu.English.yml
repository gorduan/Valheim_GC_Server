gccm_enum_Toggle: "Toggle"
gccm_enum_Always: "Always"
gccm_enum_Near: "Only near"
gccm_enum_Never: "Never"
gccm_enum_MapIcon: "Map icon"
gccm_enum_Dot: "Dot"
gccm_group_farming: "Fields"
gccm_t_fields_name: "Show and plant fields"
gccm_t_fields_desc: "With the cultivator: \"Mark field\", see yellow areas, plant in rows, holding E plants one after another. The server sets the rules (GC_Server)."
gccm_t_fields_color_name: "Field colour"
gccm_t_fields_color_desc: "Colour of area and edge. It is dimmed automatically at night."
gccm_t_fields_fill_name: "Area opacity"
gccm_t_fields_fill_desc: "0% = edge only, 100% = fully opaque."
gccm_t_fields_line_name: "Edge opacity"
gccm_t_fields_line_desc: "0% = no edge, 100% = fully opaque."
