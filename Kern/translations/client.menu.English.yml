# GC_Client - English: section in the GC Option menu
gccm_title: "GC Client (only you)"

gccm_group_inventory: "Inventory and chests"
gccm_group_world: "World"
gccm_group_portals: "Portals"
gccm_group_map: "Map"

gccm_t_trash_name: "Destroy items"
gccm_t_trash_desc: "Destroy button at the inventory and a key over an item. Never equipped or locked items."
gccm_t_trash_confirm_name: "Ask before destroying"
gccm_t_trash_confirm_desc: "Confirmation before an item is gone for good."
gccm_t_trash_button_name: "Show the button at the inventory"
gccm_t_trash_button_desc: "Without the button only the key works."
gccm_t_trash_key_name: "Key: destroy the item under the cursor"
gccm_t_trash_key_desc: "In the inventory or in a chest."

gccm_t_sort_name: "Sort"
gccm_t_sort_desc: "Sort buttons for inventory and chests. Hotbar and locked items stay in place."
gccm_t_sort_mode_name: "Sort by"
gccm_t_sort_mode_desc: "Category, name, weight (heaviest first) or value (most valuable first)."
gccm_t_sort_hotbar_name: "Do not sort the hotbar"
gccm_t_sort_hotbar_desc: "The top row (keys 1 to 8) stays as it is."
gccm_t_sort_merge_name: "Merge partial stacks"
gccm_t_sort_merge_desc: "Equal items become full stacks while sorting."
gccm_t_sort_key_player_name: "Key: sort inventory"
gccm_t_sort_key_player_desc: "With the inventory open. No key = button only."
gccm_t_sort_key_container_name: "Key: sort chest"
gccm_t_sort_key_container_desc: "With a chest open. No key = button only."

gccm_t_quicktake_name: "Empty a chest with Shift+E"
gccm_t_quicktake_desc: "Hold Shift and use a chest, cart or ship: takes everything without opening it. Holding E stays vanilla (place stacks). For linked chests only the one you look at."
gccm_t_quicktake_key_name: "Key to hold"
gccm_t_quicktake_key_desc: "Hold this key and use the chest."

gccm_t_carrylimit_name: "Carry limit"
gccm_t_carrylimit_desc: "Takes only as much of a stack as you can still carry. On the ground with Shift+E, in chests with Ctrl+left click. The rest stays."
gccm_t_carrylimit_mode_name: "When active"
gccm_t_carrylimit_mode_desc: "Hold: only while the key is held (default Shift, so Shift+E). Toggle: the key switches it on and off. Always: always active."
gccm_t_carrylimit_key_name: "Key"
gccm_t_carrylimit_key_desc: "For hold and toggle."
gccm_t_carrylimit_auto_name: "Also for auto pickup"
gccm_t_carrylimit_auto_desc: "In the modes Toggle and Always: takes partial stacks instead of leaving stacks that are too heavy. Not in Hold mode, otherwise every run with Shift would pick up partial stacks."
gccm_t_carrylimit_chest_name: "Ctrl+left click in chests with carry limit"
gccm_t_carrylimit_chest_desc: "Vanilla Ctrl+left click moves the whole stack into your inventory. With this only as much as you can carry, the rest stays in the chest."
gccm_t_compare_name: "Equipment comparison"
gccm_t_compare_desc: "When you point at a weapon, shield, clothing, jewelry or ammo in your inventory, a chest or a trader, a second box Equipped appears next to it with what equipping it would replace. At its top the differences: gains green, losses red. A two-handed weapon is compared against one-handed weapon and shield together."
gccm_t_compare_mode_name: "When to show"
gccm_t_compare_mode_desc: "Always: whenever you point at an item. Hold: only while the key is held. Toggle: the key switches the comparison on and off."
gccm_t_compare_key_name: "Key"
gccm_t_compare_key_desc: "For hold and toggle (default Shift)."
gccm_t_compare_details_name: "All stats of the equipped item"
gccm_t_compare_details_desc: "Shows the full tooltip of the equipped items below the differences. Off: only the differences."

gccm_t_cartcollect_name: "Collect into vehicles"
gccm_t_cartcollect_desc: "Picked up material goes into a nearby cart or ship that already holds the same material. Respects Guilds_Vehicle."
gccm_t_cartcollect_range_name: "Search radius"
gccm_t_cartcollect_range_desc: "How far around you vehicles are searched."
gccm_t_cartcollect_matching_name: "Only material already in the vehicle"
gccm_t_cartcollect_matching_desc: "Off: everything that fits."
gccm_t_cartcollect_ships_name: "Fill ships too"
gccm_t_cartcollect_ships_desc: "Ships with cargo space count as vehicles."
gccm_t_cartcollect_pulling_name: "Fill carts only while pulling"
gccm_t_cartcollect_pulling_desc: "Parked carts stay untouched."
gccm_t_cartcollect_key_name: "Key to pause"
gccm_t_cartcollect_key_desc: "Switches collecting on and off for a moment."

gccm_t_massharvest_name: "Area harvest"
gccm_t_massharvest_desc: "Holding E over something collectible gathers more of the same kind around it (E on gold: only gold). Crops always, everything else if enabled."
gccm_t_massharvest_radius_name: "Radius"
gccm_t_massharvest_radius_desc: "Area around the targeted plant."
gccm_t_massharvest_max_name: "Plants per step"
gccm_t_massharvest_max_desc: "At most this many plants every 0.2 seconds."
gccm_t_massharvest_all_name: "Everything collectible"
gccm_t_massharvest_all_desc: "Not only crops: also bushes, wild plants, mushrooms, stones, flint, branches, treasures, camp loot and items lying around."
gccm_t_massharvest_same_name: "Same kind only"
gccm_t_massharvest_same_desc: "Only plants like the targeted one."
gccm_t_massharvest_hold_name: "Only while holding"
gccm_t_massharvest_hold_desc: "A single press harvests one plant like vanilla."

gccm_t_autodoor_name: "Automatic doors"
gccm_t_autodoor_desc: "Doors open and close by themselves, except when enemies are near or a raid is running. Never crypt doors or foreign wards."
gccm_t_autodoor_open_name: "Open distance"
gccm_t_autodoor_open_desc: "The door opens when you come closer."
gccm_t_autodoor_close_name: "Close distance"
gccm_t_autodoor_close_desc: "The door closes when all players are farther away."
gccm_t_autodoor_enemy_name: "Enemy distance"
gccm_t_autodoor_enemy_desc: "No automation while an enemy is within this range."
gccm_t_autodoor_raid_name: "Pause during raids"
gccm_t_autodoor_raid_desc: "No automation during a raid near you."
gccm_t_autodoor_danger_name: "Close when in danger"
gccm_t_autodoor_danger_desc: "Closes doors opened by the mod as soon as nobody stands in the doorway."
gccm_t_autodoor_key_name: "Key to pause"
gccm_t_autodoor_key_desc: "Switches the automation on and off for a moment."

gccm_t_portalguard_name: "Portal name guard"
gccm_t_portalguard_desc: "Confirmation before every rename. An unchanged confirmation no longer breaks a connection. Empty names are allowed like in vanilla."
gccm_t_portalguard_confirm_name: "Ask before renaming"
gccm_t_portalguard_confirm_desc: "For named portals. A click in the portal name list does not ask."
gccm_t_portalguard_key_name: "Key: restore the old name"
gccm_t_portalguard_key_desc: "Hold it and use the portal (default Shift+E). E alone still opens the rename dialog."

gccm_t_portalnames_name: "Portal name list"
gccm_t_portalnames_desc: "When renaming a portal, a list of saved names appears next to it. With GC_Server and GC_Guilds, server and guild lists are added."
gccm_t_portalnames_click_name: "A click renames right away"
gccm_t_portalnames_click_desc: "Off: the name is only written into the input field."

gccm_t_compass_name: "Compass"
gccm_t_compass_desc: "Bar at the top of the screen with cardinal directions and map markers. Alt + left-click a marker on the large map to make it your target: gold on the map and always highlighted on the compass, at the edge when it is behind you. Player pings appear blue while Valheim shows them. Traders and other places with a map icon too. Other markers get smaller and fainter with distance. Types switched off in the map filter are hidden here too."
gccm_t_compass_focus_key_name: "Key: choose target"
gccm_t_compass_focus_key_desc: "Hold and click a marker on the large map. Click it again or click an empty spot to remove the target. The target is saved on the character, per world."
gccm_t_compass_width_name: "Width"
gccm_t_compass_width_desc: "Share of the screen width."
gccm_t_compass_fov_name: "Field of view"
gccm_t_compass_fov_desc: "Degrees shown by the bar. 180° = west to east when you face north."
gccm_t_compass_offset_name: "Distance from the top"
gccm_t_compass_offset_desc: "In pixels, for example if the bar covers something else."
gccm_t_compass_scale_name: "Size"
gccm_t_compass_scale_desc: "Icons and text."
gccm_t_compass_range_name: "Range of other markers"
gccm_t_compass_range_desc: "Markers farther away are hidden. Target and pings are always shown."
gccm_t_compass_names_name: "Names of other markers"
gccm_t_compass_names_desc: "Always, only near (distance below) or never. Target and pings always show their name, other names make room for them."
gccm_t_compass_name_range_name: "Names up to"
gccm_t_compass_name_range_desc: "Distance for \"only near\"."
gccm_t_compass_distance_name: "Show distance"
gccm_t_compass_distance_desc: "For target and pings, in meters or kilometers."
gccm_t_compass_checked_name: "Show checked markers"
gccm_t_compass_checked_desc: "Markers crossed out on the map, fainter. The target is always shown."
gccm_t_compass_players_name: "Show other players"
gccm_t_compass_players_desc: "Players visible on the map."
gccm_t_compass_icons_name: "Icons"
gccm_t_compass_icons_desc: "Map icon or a simple dot."

gccm_t_dungeonmap_name: "Dungeon map"
gccm_t_dungeonmap_desc: "Inside dungeons a map draws every room you enter. M shows it large."
gccm_t_dungeonmap_size_name: "Size of the small map"
gccm_t_dungeonmap_size_desc: "Side length at the top right of the screen."
gccm_t_dungeonmap_zoom_name: "Scale"
gccm_t_dungeonmap_zoom_desc: "Pixels per meter on the small map."
gccm_t_dungeonmap_minimap_name: "Hide the normal minimap in dungeons"
gccm_t_dungeonmap_minimap_desc: "Otherwise the minimap only shows the world above."

gccm_enum_Type: "Category"
gccm_enum_Name: "Name"
gccm_enum_Weight: "Weight"
gccm_enum_Value: "Value"
