# GC_Server - English: section in the GC Option menu
gcsv_title: "GC Server (everyone)"

gcsv_group_world: "Building"
gcsv_group_animals: "Animals"
gcsv_group_combat: "Combat"
gcsv_group_portals: "Portals"
gcsv_group_tools: "Server tools"

gcsv_t_ladder_name: "Ladder"
gcsv_t_ladder_desc: "Vertical, stackable ladder in the hammer (Misc, workbench). E on the lower rungs takes you up, on the top rungs down; Shift+E always down. Off: no longer buildable, built ladders stay."
gcsv_t_ladder_cost_name: "Wood per 2 m of ladder"
gcsv_t_ladder_cost_desc: "One ladder piece is 1 m high and costs half (rounded up)."
gcsv_t_ladder_exit_name: "Distance when getting off"
gcsv_t_ladder_exit_desc: "How far in front of or behind the ladder you land."

gcsv_t_pickaxe_name: "Pickaxe: mace swing"
gcsv_t_pickaxe_desc: "Middle mouse button swings the pickaxe like a bronze mace (three-hit combo). Left click stays the mining swing."
gcsv_t_pickaxe_enemy_name: "Damage against enemies"
gcsv_t_pickaxe_enemy_desc: "In percent of the pickaxe damage. The last hit of the combo counts double like with a mace."
gcsv_t_pickaxe_ore_name: "Damage against ore and rock"
gcsv_t_pickaxe_ore_desc: "In percent of the pickaxe damage, the same for every hit. Below 100 % so the combat swing is no mining shortcut."
gcsv_t_deflect_name: "Parry throws projectiles back"
gcsv_t_deflect_desc: "A perfect parry sends rocks, boulders and other solid projectiles back to the thrower. Never magic or fireballs."
gcsv_t_deflect_arrows_name: "Arrows and bolts too"
gcsv_t_deflect_arrows_desc: "Arrows and bolts always fly back, including fire, poison and frost arrows."
gcsv_t_deflect_damage_name: "Damage of the returned projectile"
gcsv_t_deflect_damage_desc: "Factor on the original damage, 1 = the same."
gcsv_t_bossscale_name: "Boss progression automatic"
gcsv_t_bossscale_desc: "For each main boss defeated, enemies and bosses have more health and deal more damage, added up. Automatic: 10 % per boss with EpicLoot, otherwise 5 % if leashes or Animal Care are on, otherwise 0 % (like Valheim). Every player counts their own progress (with World Advancement Progression and Guilds_Progress their state, otherwise the world)."
gcsv_t_bossscale_percent_name: "Percent per boss"
gcsv_t_bossscale_percent_desc: "Applies when “Boss progression automatic” is off: this many percent more health and damage per main boss defeated (Eikthyr, The Elder, Bonemass, Moder, Yagluth, The Queen, Fader, Kall Fimbulbringer)."
gcsv_bossscale_now: "Now: $1 % per boss, you defeated $2, so +$3 %."
gcsv_bossscale_rule: "Now: $1 % per boss."

gcsv_t_portalnames_name: "Server list of portal names"
gcsv_t_portalnames_desc: "A shared name list for all players. With GC_Client it appears in the portal dialog next to the own list."
gcsv_t_portalnames_editors_name: "Who may edit the list"
gcsv_t_portalnames_editors_desc: "Admins or all players. Everyone can always see and use it."

gcsv_t_modcheck_name: "Mod check"
gcsv_t_modcheck_desc: "Shows missing or different mods compared with the server, with a copy button. Console command modcheck."
gcsv_t_modcheck_failure_name: "Show after a failed connection"
gcsv_t_modcheck_failure_desc: "The window appears in the main menu."
gcsv_t_modcheck_join_name: "Show after joining when mods are missing"
gcsv_t_modcheck_join_desc: "Once per session."

gcsv_enum_Admins: "Admins"
gcsv_enum_Everyone: "Everyone"

gcsv_pn_title: "Server list"
gcsv_t_leash_name: "Leashes"
gcsv_t_leash_desc: "Leash item (hide or pelt, from the wolf leash on with metal bars, at the workbench). Its key puts it in your hand like a weapon: E on a tamed animal attaches or removes it, left click sends the animal to the spot you aim at, right click makes it attack the enemy you look at. Leashed and tied animals get +10 % to +120 % health and damage depending on the leash. The animal comes along through portals. Every tier has its own minimum and maximum length: while you walk, the animal keeps to the minimum length; while you stand, it moves freely up to 90 % of the maximum length. Up to the maximum length nothing costs durability, fighting included. Up to 15 % beyond, the leash stretches and loses as much durability per check as the animal has leash load (by size, strength and weight: hen 0.5, boar 1, wolf 1.5, asksvin 2.5, moose 3, lox 3.5; young ones half); beyond that it drags the animal along (at half speed) and keeps wearing. If it snaps, the animal escapes until it is caught again with a leash. E on posts, fences and walls ties it: there the leash only loses durability from direct damage and can be repaired with the hammer. With a leash in hand, E on the tied animal, or E on the knot, takes the leash back."
gcsv_t_leash_length_name: "Leash length"
gcsv_t_leash_length_desc: "The animal comes this close, up to here the leash hangs loose. Farther away it pulls, the farther, the stronger."
gcsv_t_leash_max_name: "Maximum length"
gcsv_t_leash_max_desc: "If the animal tugs farther away (too slow, behind obstacles or in a fight), you drag it behind you (at half speed), and the leash loses durability on every check."
gcsv_t_leash_slip_name: "Slip beyond the pull limit"
gcsv_t_leash_slip_desc: "Safety: this many meters beyond the pull limit (maximum length + 15 %) the leash slips out of your hand and the animal is free. This only happens when the leash cannot pull the animal along, for example over a deep ledge."
gcsv_t_leash_interval_name: "Wear every"
gcsv_t_leash_interval_desc: "For every this many seconds beyond the maximum length the leash loses as much durability as the animal's leash load. Fighting within reach costs nothing."
gcsv_t_leash_durability_name: "Durability per tier"
gcsv_t_leash_durability_desc: "One leash per biome (Gorduan, 19.10.2026). Tier 1 (deer hide) has this value, every further tier at least 1.25 times the previous one: with 30 the moose hide leash (tier 7) has 240."
gcsv_t_leash_portal_name: "Take animals along when teleporting"
gcsv_t_leash_portal_desc: "Through portals and into dungeons (in and out). Off: the leash slips out of your hand and the animal stays behind."
gcsv_t_leash_chase_name: "Stop fighting beyond"
gcsv_t_leash_chase_desc: "Leashed animals fight until the enemy is dead or this far away from them. Then they follow the player again. An attack order (right click with the leash in hand) only works on enemies within this distance."
gcsv_t_leash_cmd_level_name: "Orders from animal level"
gcsv_t_leash_cmd_level_desc: "An animal only takes left and right click orders from the leash in hand from this level on. Bred animals have a level (Animal Care), tamed ones have 0. Only while Animal Care is on."
gcsv_t_leash_cmd_cooldown_name: "Pause after an order"
gcsv_t_leash_cmd_cooldown_desc: "Per animal. It gets shorter by the average of the animal's level and half the player's Animal Care level in percent: 20 and 20 make it 15 % shorter, from 100 % there is no pause."
gcsv_t_leash_loki_name: "Return of Loki's illusions"
gcsv_t_leash_loki_desc: "A killed illusion (Loki's Mirage, EpicLoot only) returns by itself after this many seconds while the animal is leashed. The time keeps running in the leash even if you leash again. Loki reports the remaining time when you leash the animal and when an illusion dies."
gcsv_t_leash_whistles_name: "Animal whistles"
gcsv_t_leash_whistles_desc: "Four whistles: fine wood (workbench), iron, the valkyrie whistle (black metal + thunderstone) and flametal (forge). With a whistle in hand, left click (send) and right click (attack) apply to every animal on your leashes. Better whistles shorten the command pause (fine wood −6% to flametal −50%); after each whistle it is locked for 5 s. Every animal that obeys gets 5 s more speed (+3% to +25%), its leash takes no damage meanwhile, and the whistle's EpicLoot enchantments apply too."
gcsv_t_care_name: "Animal Care (skill)"
gcsv_t_care_desc: "New skill. Experience from feeding (only whoever dropped or picked the food), taming, petting, breeding and when an animal on your leash kills something. Effect up to level 100: tamed animals within the radius get up to +42 % health, healing up to 5 health + 0.42 % per second, up to +21 % damage and up to +10 % speed; taming up to 200 % faster. The player with the highest level nearby counts (not added up), leashed animals get their holder's level. Animals have a level up to 150: from breeding (random between ¾ of the parents' average and the higher parent, plus 0 to ¼ of the breeder's Animal Care) and from combat experience. They keep half of its bonus permanently (per level +2 % health, +1 % damage, +0.5 % speed, healing 0.05 health + 0.01 %) and show the level after their name."
gcsv_t_care_radius_name: "Radius"
gcsv_t_care_radius_desc: "A player must be this close for their animal care to affect tamed animals and taming."
gcsv_t_care_feed_name: "Experience for feeding"
gcsv_t_care_feed_desc: "When an animal eats food you dropped or picked. Only you get it, not everyone nearby."
gcsv_t_care_feed_cd_name: "Pause for feeding"
gcsv_t_care_feed_cd_desc: "For this long the same animal gives you no more feeding experience."
gcsv_t_care_pet_name: "Experience for petting"
gcsv_t_care_pet_desc: "E on a tamed animal without a leash in hand."
gcsv_t_care_pet_cd_name: "Pause for petting"
gcsv_t_care_pet_cd_desc: "Per animal and player (Gorduan: 30 minutes). Counted in world time, stored with the player."
gcsv_t_care_tame_name: "Experience for taming"
gcsv_t_care_tame_desc: "For whoever's food the animal ate last, otherwise the nearest player. No pause."
gcsv_t_care_breed_name: "Experience for breeding"
gcsv_t_care_breed_desc: "For the breeder (whoever's food the mother ate last) when a young animal is born or an egg is laid."
gcsv_t_care_kill_name: "Experience per kill"
gcsv_t_care_kill_desc: "When an animal on your leash kills something, times the victim's level (1 star double, 2 stars triple)."
gcsv_t_care_delay_name: "Hesitation when setting off"
gcsv_t_care_delay_desc: "When the holder starts walking, a leashed animal hesitates randomly for up to this many seconds (free will) and keeps roaming, then follows. The higher the mixed level of animal level and half the holder's Animal Care (1:2), the shorter."
gcsv_t_care_delay_level_name: "Follow at once from mixed level"
gcsv_t_care_delay_level_desc: "Mixed level = (animal level + 2 × half the holder's Animal Care) ÷ 3. From this value a leashed animal follows without hesitation, below it hesitates proportionally longer."
gcsv_t_care_xp_name: "Animal experience"
gcsv_t_care_xp_desc: "Tamed animals gain experience in combat and level up to 150. Each level costs as much as Valheim's weapon skills: 1 at level 1, 17 at 10, 178 at 50, 501 at 100, 920 at 150. Low animals level fast, high ones slowly."
gcsv_t_care_xp_factor_name: "Animal experience speed"
gcsv_t_care_xp_factor_desc: "1 = like Valheim's weapon skills, 2 = twice as fast, 0.5 = half as fast."
gcsv_t_care_xp_kill_name: "Animal experience per kill"
gcsv_t_care_xp_kill_desc: "Times the victim's level (no star 5, 1 star 10, 2 stars 15). As with weapons, every attack that hits an enemy adds 1. Only monsters and wild animals count."
gcsv_t_breed_name: "Breeding limit"
gcsv_t_breed_desc: "Valheim only lets animals have young while not too many of their kind are nearby (e.g. 4 wolves within 10 m; young and wild animals count too, for chickens hens and eggs). This raises the limit, and animals on leashes count less. Off: like Valheim."
gcsv_t_breed_factor_name: "Limit"
gcsv_t_breed_factor_desc: "Factor on Valheim's limit per species, e.g. 1.5: 4 wolves become 6. Not for chickens."
gcsv_t_breed_radius_name: "Range"
gcsv_t_breed_radius_desc: "Factor on Valheim's range in which animals are counted (1 = like Valheim, e.g. 10 m for wolves). Not for chickens."
gcsv_t_breed_leashed_name: "Animal on a leash counts"
gcsv_t_breed_leashed_desc: "How much an animal on a leash or tied to a post counts: 0.5 = half, 1 = full like Valheim. Not for chickens."
gcsv_t_breed_chicken_factor_name: "Chickens: limit"
gcsv_t_breed_chicken_factor_desc: "Factor on Valheim's limit for hens (hens and laid eggs count, chicks do not). 1 = like Valheim."
gcsv_t_breed_chicken_radius_name: "Chickens: range"
gcsv_t_breed_chicken_radius_desc: "Factor on Valheim's range for hens. 1 = like Valheim."
gcsv_t_breed_chicken_leashed_name: "Chickens: hen on a leash counts"
gcsv_t_breed_chicken_leashed_desc: "How much a hen on a leash or tied to a post counts. 1 = full like Valheim."
gcsv_group_farming: "Fields"
gcsv_t_fields_name: "Fields for the cultivator"
gcsv_t_fields_desc: "\"Mark field\" in the cultivator menu: draw an area from corner points, the cultivator plants inside in rows, holding E plants one after another. Drawing and planting need GC_Client."
gcsv_t_fields_remove_name: "Who may remove fields"
gcsv_t_fields_remove_desc: "Everyone, creator and admins, creator with guild leaders and admins, or admins only. Without the guilds mod guild leaders don't count. Plants always stay."
gcsv_t_fields_points_name: "Maximum corner points"
gcsv_t_fields_points_desc: "Per field, 0 = unlimited."
gcsv_t_fields_edge_name: "Maximum edge length"
gcsv_t_fields_edge_desc: "In metres, 0 = unlimited."
gcsv_t_fields_reach_name: "Planting reach"
gcsv_t_fields_reach_desc: "Spots in the field this far from the player get planted. You can move meanwhile."
gcsv_t_fields_interval_name: "Pause while holding E"
gcsv_t_fields_interval_desc: "Seconds between two plants. Valheim itself needs at least 0.4 s."
gcsv_t_fields_bush_name: "Spacing bushes"
gcsv_t_fields_bush_desc: "For bushes without their own growth rule, e.g. berry bushes from PlantEverything."
gcsv_t_fields_mushroom_name: "Spacing mushrooms"
gcsv_t_fields_mushroom_desc: "For mushrooms without their own growth rule."
gcsv_t_fields_other_name: "Spacing other"
gcsv_t_fields_other_desc: "For flowers, thistles and everything else without its own growth rule."
gcsv_enum_CreatorOrAdmin: "Creator and admins"
gcsv_enum_CreatorGuildLeadersOrAdmin: "Creator, guild leaders and admins"
gcsv_enum_AdminOnly: "Admins only"
gcsv_group_transport: "Transport"
gcsv_t_courier_name: "Valkyrie transport"
gcsv_t_courier_desc: "Valkyrie whistle (black metal + thunderstone, forge) no more than 1 m from a cart with lox meat and Ymir flesh: a valkyrie picks it up, including cargo that may not pass through portals. The next whistle calls it to where you stand. One cart per player at a time."
gcsv_t_courier_meat_name: "Lox meat in the cart"
gcsv_t_courier_meat_desc: "This much raw lox meat must be in the cart. The valkyrie takes it, the rest of the cargo arrives."
gcsv_t_courier_ymir_name: "Ymir flesh in the cart"
gcsv_t_courier_ymir_desc: "This much Ymir flesh must also be in the cart. The valkyrie takes it along with the lox meat."
gcsv_t_courier_raid_name: "Raid after pickup"
gcsv_t_courier_raid_desc: "Once the valkyrie is gone, a raid that is currently possible in the world starts at the cart, even without buildings nearby. With the easter egg: battle hens."
gcsv_t_courier_easter_name: "Easter egg"
gcsv_t_courier_easter_desc: "The pickup becomes completely over the top (noise, lightning, quakes, fire in the sky; no extra damage). A seagull comes instead of the valkyrie, and battle hens attack afterwards. Delivery stays the same."
gcsv_group_species: "Animal species"
gcsv_t_species_cap_name: "Cap own level + caretaker"
gcsv_t_species_cap_desc: "For the bonuses, half the animal's own level and the caretaker's Animal Care count together up to this much (Gorduan: 150). All level bonuses are scaled by 5/12: a 2-star lox at level 300 with caretaker 100 and a moose hide leash Q4 has at most 10,000 health (9,750) and 683 bite damage."
gcsv_t_species_star1_name: "Star chance 0 → 1"
gcsv_t_species_star1_desc: "Percent chance that a young animal or egg that would have no star gets one. The breeder gets a message."
gcsv_t_species_star2_name: "Star chance 1 → 2"
gcsv_t_species_star2_desc: "Percent chance that a young animal or egg with one star gets two. At most one star more per birth."
gcsv_t_species_max_wolf_name: "Max level Wolf and pup"
gcsv_t_species_max_wolf_desc: "The level rises this high through breeding and experience (default 200). The higher, the stronger the animal, but very slowly."
gcsv_t_species_max_lox_name: "Max level Lox and calf"
gcsv_t_species_max_lox_desc: "The level rises this high through breeding and experience (default 300). The higher, the stronger the animal, but very slowly."
gcsv_t_species_max_boar_name: "Max level Boar and piglet"
gcsv_t_species_max_boar_desc: "The level rises this high through breeding and experience (default 150). The higher, the stronger the animal, but very slowly."
gcsv_t_species_max_hen_name: "Max level Hen and chick"
gcsv_t_species_max_hen_desc: "The level rises this high through breeding and experience (default 150). The higher, the stronger the animal, but very slowly."
gcsv_t_species_max_asksvin_name: "Max level Asksvin and hatchling"
gcsv_t_species_max_asksvin_desc: "The level rises this high through breeding and experience (default 150). The higher, the stronger the animal, but very slowly."
gcsv_t_species_max_moose_name: "Max level Moose and calf"
gcsv_t_species_max_moose_desc: "The level rises this high through breeding and experience (default 150). The higher, the stronger the animal, but very slowly."
gcsv_t_species_max_bjorn_name: "Max level Bear and cub"
gcsv_t_species_max_bjorn_desc: "The level rises this high through breeding and experience (default 200). The higher, the stronger the animal, but very slowly."
gcsv_t_species_max_unbjorn_name: "Max level Vile"
gcsv_t_species_max_unbjorn_desc: "The level rises this high through breeding and experience (default 300). The higher, the stronger the animal, but very slowly."
gcsv_t_species_max_neck_name: "Max level Neck"
gcsv_t_species_max_neck_desc: "The level rises this high through breeding and experience (default 150). The higher, the stronger the animal, but very slowly."
gcsv_t_species_max_deer_name: "Max level Deer"
gcsv_t_species_max_deer_desc: "The level rises this high through breeding and experience (default 150). The higher, the stronger the animal, but very slowly."
gcsv_t_species_max_hare_name: "Max level Hare"
gcsv_t_species_max_hare_desc: "The level rises this high through breeding and experience (default 150). The higher, the stronger the animal, but very slowly."
gcsv_t_species_max_seal_name: "Max level Seal"
gcsv_t_species_max_seal_desc: "The level rises this high through breeding and experience (default 150). The higher, the stronger the animal, but very slowly."
gcsv_t_species_max_other_name: "Max level other animals"
gcsv_t_species_max_other_desc: "The level rises this high through breeding and experience (default 150). The higher, the stronger the animal, but very slowly."
gcsv_t_species_tame_bjorn_name: "Bears tameable"
gcsv_t_species_tame_bjorn_desc: "Bears eat honey, raspberries, blueberries and cloudberries and can be tamed in 30 minutes and leashed. Also: bear cubs (a third of the size and strength), rotten meat turns a bear (wild ones too) into a Vile after 30 minutes, saddles for bear and Vile. Off by default."
gcsv_t_species_tame_neck_name: "Necks tameable"
gcsv_t_species_tame_neck_desc: "Necks eat raw fish and can be tamed in 30 minutes and leashed. Off by default."
gcsv_t_species_tame_deer_name: "Deer tameable"
gcsv_t_species_tame_deer_desc: "Deer eat raspberries, blueberries and mushrooms from the ground (only while no player scares them away) and can be tamed in 30 minutes and leashed. Tamed, they no longer flee. Off by default."
gcsv_t_species_tame_hare_name: "Hares tameable"
gcsv_t_species_tame_hare_desc: "Hares eat mushrooms from the ground (red, yellow, jotun puffs) and can be tamed in 30 minutes and leashed. Tamed, they no longer flee. Off by default."
gcsv_t_species_tame_seal_name: "Seals tameable"
gcsv_t_species_tame_seal_desc: "Seals eat raw fish from the ground and can be tamed in 30 minutes and leashed. Tamed, they no longer flee. Off by default."
gcsv_t_species_young_fight_name: "Young animals fight"
gcsv_t_species_young_fight_desc: "Tamed young animals (piglet, wolf cub, lox calf, asksvin hatchling, moose calf, bear cub; not chicks) attack enemies like tamed adults, also on leash and whistle commands. They keep their own health and speed and never attack players or tamed animals. Off: they don't look for enemies."
gcsv_t_species_young_damage_name: "Young animals' damage"
gcsv_t_species_young_damage_desc: "Damage in percent of an adult animal of the same level (Gorduan: a quarter, 25 %). Also applies to the bear cub."
